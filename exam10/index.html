<!DOCTYPE html>
<html lang="en-AU" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#16375e">
<title>しけん · Year 10</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23eef1f5'/%3E%3Ccircle cx='32' cy='24' r='11' fill='%2316375e'/%3E%3Cpath d='M13 56c0-11 8-18 19-18s19 7 19 18z' fill='%2316375e'/%3E%3C/svg%3E">
<style>
  /* Built to a school laptop: 1366 by 768 before the browser takes its
     cut. One step fills the screen, the page itself never scrolls, and
     exactly one region inside each step takes up the slack. Laptops are
     wide and short, so width buys back height wherever it can. */
  :root{
    --bg:#eef1f5; --paper:#fff; --ink:#15191f; --muted:#4a5464;
    --line:#ccd5e0; --line-soft:#e3e9f0;
    --deep:#16375e; --accent:#a83232; --ok:#2f6a3e; --warm:#8a6d1f;
    --i:#2b5f8c;            /* い adjectives, everywhere, always */
    --na:#7a4a86;           /* な adjectives, everywhere, always */
    --noun:#5a6470;         /* the things you describe */
    --font:Calibri,Carlito,'Segoe UI',Tahoma,Verdana,sans-serif;
    /* This page was the odd one out: it went straight to Hiragino Sans,
       a gothic, and skipped every textbook face, while the hub landing
       page and the oral app both lead with UD Digi Kyokasho. So a Year 8
       learning to form characters was being shown gothic strokes here
       and kyokasho strokes everywhere else in the suite.

       The stack is now the hub's, character for character. UD Digi
       Kyokasho is the UD textbook face and ships with Windows 10 and
       later, which is the school machines; a Mac falls to YuKyokasho,
       which is also a textbook face. An iPad has no kyokasho at all and
       lands on Hiragino, which is the one gap and not one a font stack
       can close. Nothing here is downloaded. */
    --jp:'UD Digi Kyokasho N-R','UD Digi Kyokasho NP-R','UD Digi Kyokasho NK-R','UD デジタル教科書体 N-R','UDデジタル教科書体N-R','HGP教科書体','HG教科書体','YuKyokasho Yoko',YuKyokasho,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',YuGothic,Meiryo,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);
       font-size:16px;line-height:1.5;display:flex;flex-direction:column;
       overflow:hidden}

  .bar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
       background:var(--paper);
       border-bottom:1px solid var(--line);padding:7px 14px;
       padding-top:calc(7px + env(safe-area-inset-top))}
  .bar h1{font-family:var(--jp);font-size:20px;font-weight:700;line-height:1.1}
  .bar h1 span{display:block;font-family:var(--font);font-size:11px;
       font-weight:600;letter-spacing:.08em;text-transform:uppercase;
       color:var(--muted)}
  .bar .sp{flex:1}
  .tool{min-height:38px;padding:0 11px;border:2px solid var(--deep);
        border-radius:9px;background:#fff;color:var(--deep);cursor:pointer;
        font-family:var(--font);font-size:13px;font-weight:700}
  .tool.off{border-color:var(--line);color:var(--muted)}

  /* The score is a readout, not a button. Every change to it says why,
     in the chip itself: the number moves and the reason sits next to it
     for a few seconds. A number that changes with no reason given is the
     one thing a student will not trust. */
  .pts{min-height:38px;display:flex;align-items:center;gap:5px;padding:0 11px;
       border:2px solid var(--warm);border-radius:9px;background:#fffbe9;
       color:var(--warm);font-size:13px;font-weight:700}
  .pts b{font-size:17px;color:var(--ink)}
  .pts i{font-style:normal;font-size:12px;font-weight:700}
  .pts i.up{color:var(--ok)}
  .pts i.down{color:var(--accent)}

  /* The step bar is a map, not a gate: every step is reachable from the
     first second, and the mark only reports what has been done. */
  .steps{flex:none;display:flex;background:var(--paper);
         border-bottom:1px solid var(--line);overflow-x:auto}
  .steps button{flex:1;min-width:92px;border:0;background:none;cursor:pointer;
       padding:7px 6px 6px;font-family:var(--font);color:var(--muted);
       border-bottom:3px solid transparent;text-align:center}
  .steps b{display:block;font-family:var(--jp);font-size:15px;color:var(--ink);
       font-weight:700;line-height:1.2}
  .steps i{display:block;font-style:normal;font-size:10.5px;
       letter-spacing:.05em;text-transform:uppercase}
  .steps .done{color:var(--ok);font-weight:700}
  .steps button[aria-current]{border-bottom-color:var(--deep)}
  .steps button[aria-current] i{color:var(--deep)}

  main{flex:1;min-height:0;display:flex;flex-direction:column;
       padding:10px 14px 12px;max-width:1180px;width:100%;margin:0 auto}
  .rule{flex:none;background:#fffbe9;border:1px solid #e0cf9a;border-radius:9px;
        padding:8px 11px;margin-bottom:9px;font-size:14px;line-height:1.45}
  .rule b{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
        color:#7a6320;display:block;margin-bottom:2px}
  /* the how-to box folds away ten seconds in and leaves this chip */
  .rule{transition:opacity .4s}
  .rule.fading{opacity:0}
  main.folded > .rule{display:none}
  .howto{flex:none;align-self:flex-start;margin-bottom:9px;min-height:26px;
        padding:0 11px;border:1px solid #e0cf9a;background:#fffbe9;color:#7a6320;
        border-radius:999px;font:700 11px/1 var(--font);letter-spacing:.09em;
        text-transform:uppercase;cursor:pointer}
  .howto:hover{background:#fff6d8}
  @media (prefers-reduced-motion:reduce){ .rule{transition:none} }
  .rule .eg{font-family:var(--jp);font-size:15.5px;margin-top:4px}
  .rule .eg em{font-style:normal;font-family:var(--font);font-size:13px;
        color:var(--muted);margin-left:7px}
  .work{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
  /* the footer wraps. Five buttons and a line of help do not fit a
     360px phone on one row, and a row that does not wrap pushes the
     last of them off the side of the page. */
  .foot{flex:none;display:flex;align-items:center;gap:10px;margin-top:9px;
        flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .foot .hint{flex:1 1 auto;min-width:0}
  .foot .sp{flex:1}
  .hint{font-size:12.5px;color:var(--muted)}

  .btn{border:2px solid var(--deep);background:var(--deep);color:#fff;
       border-radius:9px;min-height:42px;padding:0 15px;cursor:pointer;
       font-family:var(--font);font-size:15px;font-weight:700}
  .btn.ghost{background:#fff;color:var(--deep)}
  .btn.sm{min-height:36px;font-size:13.5px;padding:0 11px}
  .btn[disabled]{opacity:.4;cursor:default}

  /* Colour is a taxonomy: い is always this blue, な always this purple,
     and a noun always grey, on every screen. Right and wrong are a tick
     or a cross and a word, never a colour on its own. */
  .k-i{color:var(--i)} .k-na{color:var(--na)} .k-noun{color:var(--noun)}
  .legend{flex:none;display:flex;gap:16px;font-size:12px;color:var(--muted);
       background:var(--paper);border-bottom:1px solid var(--line);
       padding:4px 14px}
  .legend s{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .legend s:before{content:"";width:11px;height:11px;border-radius:3px;
       background:currentColor}
  .legend .k-i:before{background:var(--i)}
  .legend .k-na:before{background:var(--na)}
  .legend .k-noun:before{background:var(--noun)}

  .grid{display:grid;gap:8px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
         align-content:start}
  .card{border:2px solid var(--line);border-radius:9px;background:var(--paper);
        padding:9px 10px;cursor:pointer;font-family:var(--font);font-size:14px;
        text-align:left;color:inherit;min-height:52px}
  .card .ja{font-family:var(--jp);font-size:18px;display:block;line-height:1.5}
  /* A word card is the word and its play button side by side, not the
     button wrapping onto a line of its own. */
  #ja .card{display:flex;align-items:center;gap:9px}
  #ja .card .ja{flex:1;min-width:0}
  #six .card{display:flex;flex-direction:column;align-items:center;gap:4px}
  .card.pick{border-color:var(--deep);background:#eef3f9}
  .card.yes{border-color:var(--ok);background:#f1f8f2}
  .card.no{border-color:var(--accent);background:#fdf2f2}
  .card.gone{opacity:.25;pointer-events:none}
  ruby rt{font-size:.5em;font-weight:400;color:var(--muted)}
  body.nofuri ruby rt{visibility:hidden}
  /* ---- what the EN button hides ----
     Andrew: "what is the EN button on the top left of screen for in
     this app? Does it work? Where does it apply." It did nothing: it
     came across from ひと, where it hides the English line under a
     question, and this app has none of those.

     It now hides the English that is a prop rather than the task: the
     caption under each box in the builders, the line of help in the
     footer, and the translation that appears under a right answer.
     What it leaves alone is the English a task is made of, because
     hiding that would not make the task harder, it would make it
     impossible: the sentence to build in ことばでつくる, the meanings
     to match in ことば, the word to catch in the game, and the form
     being asked for in どうし.

     Where a tab has none of the first kind, the button says so by
     going flat rather than pretending. */
  body.noen .en,
  body.noen .box .ask,
  body.noen .foot .hint,
  body.noen .mark p{display:none}
  .tool[disabled]{opacity:.35;cursor:default}
  .en{font-size:12.5px;color:var(--muted);display:block}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%}
  .col{border:2px dashed var(--line);border-radius:9px;padding:8px;
       display:flex;flex-direction:column;min-height:0}
  .col h4{font-family:var(--jp);font-size:17px;margin-bottom:6px;flex:none}
  .col .in{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;
       gap:6px;align-content:flex-start}
  .col.i{border-color:var(--i)} .col.i h4{color:var(--i)}
  .col.na{border-color:var(--na)} .col.na h4{color:var(--na)}
  .chip{border:2px solid var(--line);border-radius:8px;background:var(--paper);
        padding:6px 10px;font-family:var(--jp);font-size:17px;cursor:pointer;
        color:inherit;min-height:40px}
  .chip.yes{border-color:var(--ok)} .chip.no{border-color:var(--accent)}
  .chip.pick{border-color:var(--deep);background:#eef3f9}
  .col{cursor:pointer} .col:focus{outline:2px solid var(--deep);outline-offset:2px}
  .chip.gone{opacity:.3;pointer-events:none}

  /* ---------- ことば: listen, then drag ----------
     touch-action is what lets a thumb drag a chip instead of scrolling
     the page out from under it. */
  .wslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
          gap:9px;align-content:start}
  .wslot{border:2px dashed var(--line);border-radius:10px;padding:8px 11px;
         min-height:64px;display:flex;align-items:center;gap:10px;
         background:var(--paper)}
  .wslot .mean{flex:1;font-size:15px}
  .wslot .got{font-family:var(--jp);font-size:19px;display:flex;
              align-items:center;gap:7px}
  .wslot.over{border-color:var(--deep);border-style:solid;background:#eef3f9}
  .wslot.yes{border-style:solid;border-color:var(--ok);background:#f1f8f2}
  .wslot.no{border-color:var(--accent);background:#fdf2f2}
  .wtray{display:flex;flex-wrap:wrap;gap:9px;flex:1}
  .wchip{width:76px;height:58px;border:2px solid var(--deep);border-radius:10px;
         background:var(--paper);color:var(--deep);display:flex;
         align-items:center;justify-content:center;cursor:grab;
         position:relative;touch-action:none;-webkit-user-select:none;
         user-select:none}
  .wchip .num{position:absolute;top:2px;left:6px;font-size:11px;
              font-weight:700;color:var(--muted)}
  .wchip svg{width:24px;height:24px}
  .wchip .jp{color:var(--ink)}
  .wchip.pick{background:#eef3f9;box-shadow:0 0 0 3px rgba(22,55,94,.18)}
  .wchip.dragging{position:fixed;z-index:60;pointer-events:none;cursor:grabbing;
         box-shadow:0 8px 20px rgba(0,0,0,.25);margin:0}
  @media (max-width:760px){
    .wslots{grid-template-columns:1fr 1fr}
    .wchip{width:62px;height:52px}
  }


  /* ---------- きせかえ: drag the clothes onto the figure ----------
     The drop targets live inside the SVG, so they scale with the drawing
     and a finger lands where it looks like it is landing. An empty one is
     a dashed outline, because an empty place has to look like a place. */
  /* The figure stays put while the trays scroll under it. On a phone the
     colours are below the fold, and a drag that starts on a chip has to
     end on a figure that is still on screen. */
  .dressfig{width:230px;position:sticky;top:0;align-self:flex-start;z-index:1}
  .dressfig .fig{max-height:360px;height:auto;width:100%}
  .zone{cursor:pointer;stroke:#8a97a8;stroke-width:1.1;stroke-dasharray:5 4;
        transition:fill-opacity .12s}
  .zone.full{stroke:none}
  .zone.over{fill-opacity:.16;stroke:var(--deep);stroke-width:2;stroke-dasharray:none}
  .zone.yes{stroke:var(--ok);stroke-width:2.2;stroke-dasharray:none}
  .zone.no{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:none}
  /* シャツ, Tシャツ and セーター all draw the same, so whatever is on a
     zone says its own name. */
  /* The label sits in the middle of its zone, which is exactly where a
     thumb aims. Without this it swallows the drop and a colour can never
     be put on the clothes it is for. */
  .ztag{fill:#fff;fill-opacity:.82;stroke:rgba(20,25,32,.28);stroke-width:.8;
        pointer-events:none}
  .ztxt{font-family:var(--jp);font-size:11px;fill:var(--ink);text-anchor:middle;
        pointer-events:none}
  .listen{flex-wrap:wrap;margin-bottom:7px}
  .listen .say{width:32px;height:32px;font-size:13px;font-weight:700}
  /* These chips carry a word, not an icon, so they are word-shaped. The
     fixed square of the ことば step wraps めがね onto two lines and spills
     it out of its own border. */
  .dress .wchip{width:auto;min-width:0;height:auto;min-height:44px;
       padding:4px 11px;white-space:nowrap}
  .dress .wchip .jp{font-size:18px;white-space:nowrap;line-height:1.3}
  .cchip{gap:7px}
  .cchip .sw{width:16px;height:16px;border-radius:3px;flex:none;
       border:1px solid rgba(20,25,32,.3)}
  #script p{margin-bottom:3px}
  /* On a phone the trays and the figure have to be on screen together.
     A drag cannot cross a scroll: if the chips are below the fold the
     gesture is impossible, not merely awkward. So this one keeps its two
     columns at every width and shrinks everything in them instead. */
  @media (max-width:760px){
    .who.dress{flex-direction:row;gap:9px}
    .dressfig{width:116px;margin:0}
    .dressfig .fig{max-height:238px}
    .dress .wchip{min-height:38px;padding:3px 8px}
    .dress .wchip .jp{font-size:16px}
    .dress .cchip{gap:5px}
    .dress .cchip .sw{width:13px;height:13px}
    .dress .tiles{gap:5px;margin-bottom:6px}
    /* a four-example rule is most of a phone screen, and the task is
       underneath it */
    .rule.tight{max-height:7.6em;overflow:auto}
  }
  @media (max-width:380px){
    .dressfig{width:98px}
    .dress .wchip{min-height:34px;padding:2px 7px}
    .dress .wchip .jp{font-size:15px}
  }

  .fig{display:block;margin:0 auto;height:100%;max-height:260px}
  .who{display:flex;gap:16px;align-items:flex-start;height:100%}
  .who .q{display:flex;flex-direction:column;min-height:0}
  #ta{flex:none}
  .who .pic{flex:none;width:150px}
  .who .q{flex:1;min-width:0}
  .jp{font-family:var(--jp);font-size:21px;line-height:1.7}
  .say{border:2px solid var(--deep);background:#fff;border-radius:8px;
       width:36px;height:36px;cursor:pointer;padding:0;color:var(--deep);
       font-size:15px;vertical-align:middle}
  body:not(.hasvoice) .say{display:none}

  .tiles{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
  .slot{min-height:52px;border:2px dashed var(--line);border-radius:9px;
        padding:7px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}

  textarea{width:100%;font-family:var(--jp);font-size:19px;line-height:1.7;
       border:2px solid var(--line);border-radius:9px;padding:9px 11px;
       resize:none;background:var(--paper);color:inherit}
  textarea:focus{border-color:var(--deep);outline:none}
  .mark{border-left:4px solid var(--line);padding:5px 10px;margin:6px 0;
        font-size:14px}
  .mark.yes{border-color:var(--ok)} .mark.no{border-color:var(--accent)}
  .mark.hm{border-color:#b8860b}
  .mark b{display:block;font-size:11px;letter-spacing:.08em;
        text-transform:uppercase;color:var(--muted)}
  /* the two sorting steps: the phrase the answer builds, right or wrong */
  .ph{font-family:var(--jp);font-size:18px;line-height:1.45;margin:2px 0}
  .ph i{font-style:normal;font-family:var(--font);font-size:11px;
        letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
        margin-right:8px}
  .ph.bad{color:var(--accent)}
  .mark .ph b{display:inline;font-size:inherit;letter-spacing:0;
        text-transform:none;color:var(--ok)}
  .ph .add{color:var(--ok)}
  .ph .sw,.chip .sw{display:inline-block;width:14px;height:14px;border-radius:3px;
        border:1px solid rgba(20,25,32,.35);vertical-align:-1px;margin-right:6px}
  .mark p{font-size:12.5px;line-height:1.4;color:var(--muted);margin-top:3px}
  .mark .jp-in{font-family:var(--jp)}
  .mark .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .fbslot{flex:none;max-height:40vh;overflow:auto}
  .work.fit{flex:0 1 auto}
  /* A short screen (an older phone, or a laptop with a toolbar open)
     gives the rule box a scroll of its own rather than pushing the
     exercise off the bottom of the page. */
  @media (max-height:640px){
    .rule{max-height:72px;overflow:auto}
    .slot#pool{max-height:56px;overflow:auto}
    .col h4{font-size:15px;margin-bottom:4px}
  }
  .fbslot .mark{margin:8px 0 0}
  /* the one thing a drawing cannot say, handed over in English on the
     writing step so the student has something true to write */
  .brief{margin-top:8px;font-size:12.5px;line-height:1.4;
       color:var(--muted);text-align:center}
  .brief b{color:var(--ink);font-weight:700}
  /* ---- the かさおばけ ----
     Fixed, so it drifts over whatever is on screen, and pointer-events
     none so it can never swallow a tap meant for the feedback under it.
     Floats up and fades; the small sway stops it reading as a sprite on
     a rail. */
  /* Which build is on screen. Without it there is no way to tell a
     change that did not work from a change that never arrived, and that
     question cost Andrew three rounds of asking for the same thing. */
  .build{position:fixed;right:4px;bottom:2px;z-index:70;pointer-events:none;
     font-family:var(--font);font-size:9px;letter-spacing:.04em;
     color:var(--line);user-select:none}
  .yoka,.ninj{position:fixed;z-index:60;pointer-events:none}
  .yoka{transform:translate(-50%,0);animation:yfloat 1.6s ease-out forwards}
  /* The ninja crosses and is gone in 0.7s. Right should be acknowledged
     and then got out of the way of: it is the thing you want to be
     unremarkable and repeatable, so it cannot take as long as being
     wrong does. */
  .ninj{transform:translate(-50%,-50%);animation:ndash .7s cubic-bezier(.2,.8,.3,1) forwards}
  .ninj svg{display:block;filter:drop-shadow(0 2px 5px rgba(20,25,32,.3))}
  @keyframes ndash{
    0%{opacity:0;transform:translate(-190%,-50%) scale(.9)}
    22%{opacity:1}
    70%{opacity:1;transform:translate(-20%,-54%) scale(1)}
    100%{opacity:0;transform:translate(120%,-58%) scale(.96)}
  }
  .yoka svg{display:block;filter:drop-shadow(0 2px 6px rgba(20,25,32,.25))}
  @keyframes yfloat{
    0%{opacity:0;transform:translate(-50%,10px) scale(.84) rotate(-4deg)}
    18%{opacity:.95}
    55%{transform:translate(-42%,-70px) scale(1) rotate(5deg)}
    100%{opacity:0;transform:translate(-56%,-150px) scale(1.02) rotate(-3deg)}
  }
  /* ---- reduced motion ----
     Not hidden. Hiding them was the whole reason Andrew could not see
     either one. What that setting is for is movement across the screen,
     so under it the pair simply fade in where they are and fade out
     again, and the feedback survives. */
  @media (prefers-reduced-motion:reduce){
    .ninj,.yoka{animation-name:cfade;animation-duration:1.1s;
      animation-timing-function:ease-out}
    @keyframes cfade{
      0%{opacity:0} 18%{opacity:1} 70%{opacity:1} 100%{opacity:0}
    }
  }

  /* ---- the drum, lifted with the module from the oral app ---- */
  .rwin{position:relative;flex:1;min-width:0;height:192px;overflow:hidden;
        background:var(--paper);border:1px solid var(--line);border-radius:9px;
        touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;
        -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24%,
                           #000 76%,transparent 100%);
        mask-image:linear-gradient(to bottom,transparent 0,#000 24%,
                   #000 76%,transparent 100%)}
  .reel.spinning .rwin{cursor:default}
  .rwin:active{cursor:grabbing}
  .rstrip{will-change:transform}
  .ritem{height:64px;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:1px;text-align:center;padding:0 10px}
  .ritem b{font-size:clamp(16px,5vw,21px);font-weight:600;line-height:1.15;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
           max-width:100%}
  .ritem i{font-style:normal;font-size:12px;color:var(--muted);
           letter-spacing:.04em}
  .rmark{position:absolute;left:0;right:0;top:64px;height:64px;
         pointer-events:none;border-top:2px solid var(--deep);
         border-bottom:2px solid var(--deep);background:rgba(0,0,0,.035)}
  .reel{display:flex;align-items:center;gap:9px;margin:2px 0 10px}
  .rspin{flex:none;width:44px;height:44px;border-radius:50%;cursor:pointer;
         padding:0;border:2px solid var(--line);background:var(--paper);
         color:var(--deep);display:flex;align-items:center;
         justify-content:center;opacity:.78;transition:opacity .13s}
  .rspin:hover,.rspin:focus{opacity:1;border-color:var(--deep);outline:none}
  .rspin svg{width:21px;height:21px}
  .reel.spinning .rspin{opacity:.3;pointer-events:none}
  .ask-en{font-size:15px;color:var(--muted);margin:2px 0 7px}
  .ask-en b{color:var(--ink);font-size:17px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #sin{flex:1;min-width:0;font-family:var(--jp);font-size:22px;
       border:2px solid var(--line);border-radius:9px;padding:8px 11px;
       background:var(--paper);color:inherit}
  #sin:focus{border-color:var(--deep);outline:none}
  /* 〜くて: the frame carries は and です so that no tile announces
     where it goes, and a gap is a gap rather than an empty box. */
  .jline{margin:10px 0;font-size:21px;line-height:1.9}
  .jline .gap{text-decoration:none;border-bottom:3px solid var(--line);
       padding:0 10px;color:var(--muted)}
  .chip .gl{display:block;font-family:var(--font);font-size:11.5px;
       font-style:normal;font-weight:600;color:var(--muted);margin-top:1px}
  /* ことばキャッチ: the canvas is 320 by 200 whatever size it is drawn at,
     and the browser is told not to smooth it, so every pixel arrives as a
     square. The coarseness is the point, not a filter over it.

     Landscape, because several words have to be in the air at once and a
     portrait screen only fits one. The question sits above the screen in
     ordinary page text, not in the pixels: it is the one thing here that
     is not meant to be a game. */
  .arcadewrap{display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:8px;padding:4px 0;min-height:0}
  /* The question. It is pinned to the top of the scrolling area, so no
     amount of scrolling can put it off the screen, and it carries a word
     from the moment the rung opens rather than a dash until somebody
     presses Start. */
  .prompt{position:sticky;top:0;z-index:4;align-self:stretch;
       display:flex;align-items:baseline;justify-content:center;gap:12px;
       padding:7px 18px;border:2px solid #8a6d1f;border-radius:10px;
       background:#fffbe9}
  .prompt .lab{font-size:11px;font-weight:700;letter-spacing:.14em;
       color:#8a6d1f}
  .prompt b{font-size:27px;line-height:1.2;color:var(--ink)}
  @media (max-width:700px){ .prompt b{font-size:21px} }
  .arcade{display:block;height:auto;width:min(100%,900px);
       aspect-ratio:320/200;background:#000;border:3px solid #2f8f2f;
       border-radius:6px;cursor:none;touch-action:none;
       image-rendering:pixelated;image-rendering:crisp-edges}
  .arcade:focus{outline:2px solid #6cf06c;outline-offset:2px}
  @media (max-width:700px){
    .prompt b{font-size:19px} .arcade{width:100%}
  }
  /* On the game step the page scrolls, which it does nowhere else here.
     Andrew: "The explanation of the game in the yellow box is getting in
     the way on a laptop browser. Let it scroll out of view to maximise
     the view of game play."

     So main becomes the scroller, the game is given a whole screenful of
     its own below the explanation, and the footer is pinned to the
     bottom so Start and the score stay reachable wherever you have
     scrolled to. Pressing Start scrolls the screen up for you, because
     the first thing a student does is press Start and the next thing
     they need is all of the screen. */
  body.gamefull main{overflow-y:auto;overscroll-behavior:contain}
  body.gamefull .arcadewrap{flex:none;overflow:visible}
  body.gamefull .foot{position:sticky;bottom:0;z-index:3;margin-top:0;
       padding:7px 0 2px;background:var(--bg)}
  .score{font-size:13px;color:var(--muted)}
  .score b{color:var(--ink);font-size:16px}
  /* Seven tools and a score will not sit on one line of a 320px phone,
     and at full size they took four rows with them. The bar is the least
     interesting thing on the page and should take the least room. */
  @media (max-width:420px){
    .bar{gap:6px;padding:5px 9px}
    .bar h1{font-size:17px}
    .tool{min-height:32px;padding:0 7px;font-size:11.5px}
    .pts{min-height:32px;padding:0 8px;font-size:11.5px}
    .pts b{font-size:15px}
  }
  @media (max-width:760px){
    .bar{padding:6px 10px} .tool{padding:0 8px;font-size:12px}
    .legend{padding:4px 10px;gap:12px}
    .steps button{min-width:78px} .steps b{font-size:13.5px}
  }
  @media (max-width:700px){
    .who{flex-direction:column} .who .pic{width:120px;margin:0 auto}
    main{padding:8px 10px 10px}
  }

  /* ================= this app's own parts =================
     A practice paper is not a game, so nothing here is dressed up as
     one. What it adds to a printed paper is the three things paper
     cannot do: it says which pieces a marker is looking for, it hides
     the model answer until something has been written, and it counts
     the characters in an essay while it is being written. */

  /* ---- a reading text ---- */
  .text{font-family:var(--jp);font-size:17.5px;line-height:2.5;
       background:var(--paper);border:1px solid var(--line-soft);
       border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .text h3{font-size:15px;margin-bottom:6px;color:var(--muted);
       font-family:var(--font);font-weight:600;line-height:1.3;
       display:flex;justify-content:space-between;gap:12px;align-items:baseline;
       flex-wrap:wrap}
  .text h3 .mk{font-weight:400;font-size:12.5px;white-space:nowrap}
  .text h3 .tt{font-family:var(--jp);font-size:16px;color:var(--ink)}
  .gloss{display:flex;flex-wrap:wrap;gap:4px 14px;border:1px dashed var(--line);
       border-radius:10px;padding:7px 10px;margin:0 0 10px;font-size:13px}
  .gloss b{font-family:var(--jp);font-weight:600;font-size:14.5px}
  .gloss span{color:var(--muted)}
  .qn{border-top:1px solid var(--line-soft);padding:10px 0 2px}
  .qn:first-child{border-top:0}
  .qn .ask{font-family:var(--jp);font-size:16.5px;line-height:1.9}
  .qn .ask em{font-style:normal;font-family:var(--font);font-size:12.5px;
       color:var(--muted);margin-left:6px}
  .qn .mk{float:right;font-size:12px;color:var(--muted);font-family:var(--font)}
  textarea.ans,input.ans{width:100%;font-family:var(--jp);font-size:16px;
       border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;
       background:var(--paper);color:var(--ink);margin-top:5px}
  textarea.ans{min-height:52px;line-height:1.8;resize:vertical}
  textarea.ans:focus,input.ans:focus{outline:none;border-color:var(--deep)}
  .ansrow{display:flex;gap:7px;align-items:flex-start;margin-top:6px;flex-wrap:wrap}

  /* what the marker is looking for, ticked off as it is found */
  .looks{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .look{font-size:12px;border:1px solid var(--line);border-radius:999px;
       padding:2px 9px;color:var(--muted)}
  .look.got{border-color:var(--ok);background:#eefaf0;color:#1c6b32}
  .model{font-family:var(--jp);font-size:16px;line-height:1.9;
       border-left:4px solid var(--ok);padding:4px 10px;margin-top:7px;
       background:#f5fbf6}
  .model em{font-style:normal;font-family:var(--font);font-size:12.5px;
       color:var(--muted);display:block;line-height:1.4}

  /* ---- the listening passage ---- */
  .turn{display:grid;grid-template-columns:7.5em auto 1fr;gap:8px;align-items:baseline;
       padding:3px 4px;border-radius:7px}
  .turn.now{background:#fffbe9}
  .whoami{font-family:var(--jp);font-size:13.5px;color:var(--muted);text-align:right}
  .jaline{font-family:var(--jp);font-size:16.5px;line-height:2}
  .card{margin-top:10px}
  @media (max-width:560px){
    .turn{grid-template-columns:1fr;gap:2px}
    .whoami{text-align:left}
  }
  /* ---- grammar ---- */
  .form{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .form b{font-family:var(--jp);font-size:22px}
  .form i{font-style:normal;color:var(--muted);font-size:13.5px}
  .hintbox{font-size:13px;color:var(--muted);margin-bottom:8px}
  .prompt2{font-family:var(--jp);font-size:17px;line-height:1.9;margin-top:8px}

  /* ---- kanji, the paper's own three columns ---- */
  .ktable{width:100%;border-collapse:collapse;max-width:620px;margin:0 auto}
  .ktable th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
       color:var(--muted);font-weight:600;padding:4px 8px;text-align:left}
  .ktable td{border-top:1px solid var(--line-soft);padding:7px 8px;
       font-family:var(--jp);font-size:19px}
  .ktable td.en{font-family:var(--font);font-size:14px;color:var(--ink)}
  .ktable tr.now{background:#fffbe9}
  .ktable td.gap{color:var(--muted);font-family:var(--font);font-size:13px}
  .kchoices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .kchoices .pick{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);
       min-height:46px;padding:0 14px;font-family:var(--jp);font-size:19px;cursor:pointer}
  .kchoices .pick.en{font-family:var(--font);font-size:14.5px}
  .kchoices .pick.ok{border-color:var(--ok);background:#eefaf0}
  .kchoices .pick.no{border-color:var(--accent);background:#fdeeee}

  /* ---- the essay ---- */
  .topics{display:grid;gap:8px;margin-bottom:10px}
  .topic{border:1.5px solid var(--line);border-radius:11px;background:var(--paper);
       padding:9px 11px;cursor:pointer;text-align:left;font-family:var(--font)}
  .topic[aria-pressed="true"]{border-color:var(--deep);background:#eef4fb}
  .topic .ja{display:block;font-family:var(--jp);font-size:16px;line-height:1.7}
  .topic .en{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .count{font-variant-numeric:tabular-nums;font-weight:700}
  .count.under{color:var(--accent)} .count.in{color:var(--ok)}
  .steps2{font-size:13.5px;line-height:1.7;color:var(--ink);padding-left:18px}
  .steps2 li{margin:2px 0}
  .checks{display:grid;gap:4px;margin-top:8px}
  .checks label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;
       color:var(--ink);cursor:pointer}
  .checks input{margin-top:3px}
  .rubric{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  .rubric th{text-align:left;color:var(--muted);font-weight:600;padding:4px 6px;
       font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .rubric td{border-top:1px solid var(--line-soft);padding:5px 6px;vertical-align:top;
       line-height:1.35}
  .rubric td:first-child{font-weight:600;width:22%}

  /* ---- strategy, and the paper at a glance ---- */
  .plan{width:100%;border-collapse:collapse;max-width:620px}
  .plan td,.plan th{border-top:1px solid var(--line-soft);padding:6px 8px;font-size:13.5px;
       text-align:left}
  .plan th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .plan .ja{font-family:var(--jp);font-size:15.5px}
  .tips{display:grid;gap:9px;margin-top:12px}
  .tip{border-left:3px solid var(--line);padding:2px 0 2px 10px}
  .tip b{display:block;font-size:13.5px}
  .tip p{font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>
