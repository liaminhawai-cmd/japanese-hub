<!DOCTYPE html>
<html lang="ja" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#16375e">
<title>ひっきしけん · VCE Units 3 and 4 written examination</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f4efe6'/%3E%3Crect x='14' y='10' width='36' height='44' rx='3' fill='%23fff' stroke='%2316375e' stroke-width='3'/%3E%3Cpath d='M21 22h22M21 31h22M21 40h13' stroke='%2316375e' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* Same palette, same font stack and the same one-rung-fills-the-screen
     shape as れきしの人 and the oral app, so the three read as one suite. */
  :root{
    --bg:#eef1f5; --paper:#fff; --ink:#15191f; --muted:#4a5464;
    --line:#ccd5e0; --line-soft:#e3e9f0;
    --deep:#16375e; --accent:#a83232; --ok:#2f6a3e; --warm:#8a6d1f;
    --voiceA:#1f5f7a; --voiceB:#7a3f1f;
    --font:Calibri,Carlito,'Segoe UI',Tahoma,Verdana,sans-serif;
    --jp:'UD Digi Kyokasho N-R','UD Digi Kyokasho NP-R','UD Digi Kyokasho NK-R','UD デジタル教科書体 N-R','UDデジタル教科書体N-R','HGP教科書体','HG教科書体','YuKyokasho Yoko',YuKyokasho,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',YuGothic,Meiryo,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);
       font-size:16px;line-height:1.5;display:flex;flex-direction:column;
       overflow:hidden}

  .bar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
       background:var(--paper);border-bottom:1px solid var(--line);
       padding:7px 14px;padding-top:calc(7px + env(safe-area-inset-top))}
  .bar h1{font-family:var(--jp);font-size:20px;font-weight:700;line-height:1.1}
  .bar h1 span{display:block;font-family:var(--font);font-size:11px;
       font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .bar .sp{flex:1}
  .tool{min-height:38px;padding:0 11px;border:2px solid var(--deep);
        border-radius:9px;background:#fff;color:var(--deep);cursor:pointer;
        font-family:var(--font);font-size:13px;font-weight:700}
  .tool.off{border-color:var(--line);color:var(--muted)}
  .pts{min-height:38px;display:flex;align-items:center;gap:5px;padding:0 11px;
       border:2px solid var(--warm);border-radius:9px;background:#fffbe9;
       color:var(--warm);font-size:13px;font-weight:700}
  .pts b{font-size:17px;color:var(--ink)}

  .steps{flex:none;display:flex;background:var(--paper);
         border-bottom:1px solid var(--line);overflow-x:auto}
  .steps button{flex:1;min-width:92px;border:0;background:none;cursor:pointer;
       padding:7px 6px 6px;font-family:var(--font);color:var(--muted);
       border-bottom:3px solid transparent;text-align:center}
  .steps b{display:block;font-family:var(--jp);font-size:15px;color:var(--ink);
       font-weight:700;line-height:1.2}
  .steps i{display:block;font-style:normal;font-size:10.5px;
       letter-spacing:.05em;text-transform:uppercase}
  .steps button[aria-current]{border-bottom-color:var(--deep)}
  .steps button[aria-current] i{color:var(--deep)}

  /* the chip row: which strand, which text, which text type */
  .pick{flex:none;display:flex;gap:7px;align-items:center;overflow-x:auto;
       background:var(--paper);border-bottom:1px solid var(--line);padding:5px 14px}
  .pick button{flex:none;border:2px solid var(--line);border-radius:999px;
       background:#fff;color:var(--muted);cursor:pointer;padding:3px 11px;
       font-family:var(--jp);font-size:14px;min-height:32px}
  .pick button[aria-current]{border-color:var(--deep);color:var(--deep);
       background:#eef3f9;font-weight:700}
  .pick .lbl{flex:none;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
       color:var(--muted);font-weight:700;padding-right:2px}

  main{flex:1;min-height:0;display:flex;flex-direction:column;
       padding:10px 14px 12px;max-width:1180px;width:100%;margin:0 auto}
  .rule{flex:none;background:#fffbe9;border:1px solid #e0cf9a;border-radius:9px;
        padding:8px 11px;margin-bottom:9px;font-size:14px;line-height:1.45}
  .rule b{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
        color:#7a6320;display:block;margin-bottom:2px}
  /* the how-to box folds away ten seconds in and leaves this chip */
  .rule{transition:opacity .4s}
  .rule.fading{opacity:0}
  main.folded > .rule{display:none}
  .howto{flex:none;align-self:flex-start;margin-bottom:9px;min-height:26px;
        padding:0 11px;border:1px solid #e0cf9a;background:#fffbe9;color:#7a6320;
        border-radius:999px;font:700 11px/1 var(--font);letter-spacing:.09em;
        text-transform:uppercase;cursor:pointer}
  .howto:hover{background:#fff6d8}
  /* Which build is on screen. Without it there is no way to tell a
     change that did not work from a change that never arrived. */
  .build{position:fixed;right:4px;bottom:2px;z-index:70;pointer-events:none;
     font-family:var(--font);font-size:9px;letter-spacing:.04em;
     color:var(--line);user-select:none}
  @media (prefers-reduced-motion:reduce){ .rule{transition:none} }
  .rule ul{margin:3px 0 0 17px} .rule li{margin:1px 0}
  .work{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
  .foot{flex:none;display:flex;align-items:center;gap:10px;margin-top:9px;
        font-size:13px;color:var(--muted);flex-wrap:wrap}
  .foot .sp{flex:1}
  .btn{border:2px solid var(--deep);background:var(--deep);color:#fff;
       border-radius:9px;min-height:42px;padding:0 15px;cursor:pointer;
       font-family:var(--font);font-size:15px;font-weight:700}
  .btn.ghost{background:#fff;color:var(--deep)}
  .btn.sm{min-height:36px;font-size:13.5px;padding:0 11px}
  .btn[disabled]{opacity:.4;cursor:default}

  .col{max-width:40em;margin:0 auto}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:11px;
        padding:11px 13px;margin-bottom:10px}
  .card h3{font-size:15px;margin-bottom:4px}
  .card h3 .jp{font-family:var(--jp);font-size:17px}
  .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;
       color:var(--muted);font-weight:700}
  .jp{font-family:var(--jp)}
  ruby rt{font-size:.46em;font-weight:400;color:var(--muted)}
  body.nofuri ruby rt{visibility:hidden}

  /* ---- a drill item ---- */
  .stem{font-family:var(--jp);font-size:23px;line-height:2;margin:4px 0 12px}
  .gap{display:inline-block;min-width:2.1em;border-bottom:3px solid var(--deep);
       text-align:center;color:var(--deep);font-weight:700}
  .gap.filled{border-bottom-color:var(--ok);color:var(--ok)}
  .opts{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:10px}
  .opts button{font-family:var(--jp);font-size:21px;min-height:52px;min-width:72px;
       border:2px solid var(--line);border-radius:11px;background:#fff;
       color:var(--ink);cursor:pointer;padding:0 14px}
  .opts button:hover{border-color:var(--deep)}
  .opts button.yes{border-color:var(--ok);background:#eef7f0;color:var(--ok)}
  .opts button.no{border-color:var(--accent);background:#fbeeee;color:var(--accent)}
  .opts button[disabled]{cursor:default;opacity:.55}
  .opts button.yes[disabled],.opts button.no[disabled]{opacity:1}

  .mark{border-left:4px solid var(--line);padding:6px 11px;margin:8px 0;font-size:14px}
  .mark.yes{border-color:var(--ok)} .mark.no{border-color:var(--accent)}
  .mark b{display:block;font-size:11px;letter-spacing:.08em;
       text-transform:uppercase;color:var(--muted)}
  .mark .jp{font-size:18px}
  /* what the assessors actually wrote. Quoted, dated, and never more than
     a sentence or two, because this app is not a copy of the report. */
  .said{background:#f4f6fa;border:1px solid var(--line-soft);border-radius:9px;
        padding:7px 10px;margin-top:7px;font-size:13.5px;color:var(--muted)}
  .said em{font-style:italic;color:var(--ink)}
  .said .yr{display:inline-block;font-weight:700;color:var(--deep);
        font-size:11px;letter-spacing:.07em;margin-right:6px}

  /* ---- spot the error ---- */
  .hunt{font-family:var(--jp);font-size:23px;line-height:2.1;margin:6px 0 10px}
  .hunt .ch{cursor:pointer;border-radius:4px;padding:1px 2px}
  .hunt .pn{border-radius:4px;padding:1px 0}
  .hunt .ch:hover{background:#fdf3c9}
  .hunt .ch.pick{background:#fbeeee;box-shadow:inset 0 -3px 0 var(--accent)}
  .hunt .ch.hit,.hunt .pn.hit{background:#eef7f0;box-shadow:inset 0 -3px 0 var(--ok)}
  .fixline{font-family:var(--jp);font-size:21px;line-height:1.9}
  .fixline .was{color:var(--accent);text-decoration:line-through}
  .fixline .now{color:var(--ok);font-weight:700}

  /* ---- listening and reading ---- */
  .turn{display:flex;gap:9px;align-items:flex-start;margin:0 0 7px}
  .turn .who{flex:none;min-width:5.6em;font-size:12px;font-weight:700;
       padding-top:5px;font-family:var(--jp)}
  .turn.a .who{color:var(--voiceA)} .turn.b .who{color:var(--voiceB)}
  .turn .ja{flex:1;font-family:var(--jp);font-size:19px;line-height:1.95}
  .turn.a{border-left:3px solid var(--voiceA);padding-left:8px}
  .turn.b{border-left:3px solid var(--voiceB);padding-left:8px}
  .turn.now{background:#fffbe9}
  .turn .pl{flex:none}
  body.hidescript .turn .ja{filter:blur(5px);user-select:none}
  body.hidescript .turn.now .ja{filter:none}
  .para{font-family:var(--jp);font-size:20px;line-height:2.05;margin:0 0 12px;
        text-align:justify}
  .qrow{border-top:1px solid var(--line-soft);padding-top:9px;margin-top:9px}
  .qrow .q{font-size:16px;margin-bottom:5px;font-weight:600}
  .qrow .q.jp{font-family:var(--jp);font-size:19px;font-weight:400}
  .qrow .mk{float:right;font-size:12px;color:var(--muted);font-weight:700}
  textarea.ans{width:100%;font-family:var(--jp);font-size:19px;
       border:2px solid var(--line);border-radius:9px;padding:8px 11px;
       background:var(--paper);color:inherit;resize:vertical;min-height:62px}
  textarea.ans.en{font-family:var(--font);font-size:16px}
  textarea.ans:focus{border-color:var(--deep);outline:none}

  /* ---- writing ---- */
  .feat{display:flex;gap:10px;align-items:flex-start;margin:0 0 7px}
  .feat .f{flex:none;max-width:18em;font-family:var(--jp);font-size:17px;
       color:var(--deep);font-weight:700}
  .feat .w{flex:1;font-size:14px;color:var(--muted)}
  .mline{display:flex;gap:10px;align-items:flex-start;margin:0 0 6px;
       border-left:3px solid var(--line-soft);padding-left:9px;cursor:pointer}
  .mline:hover{border-left-color:var(--deep)}
  .mline.open{border-left-color:var(--deep);background:#f7f9fc}
  .mline .ja{flex:1;font-family:var(--jp);font-size:19px;line-height:1.95}
  .mline .tg{flex:none;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
       color:var(--muted);font-weight:700;padding-top:6px}
  .mline .nt{font-size:13.5px;color:var(--muted);margin-top:3px}
  .slot{margin-bottom:9px}
  .slot .q{font-size:15px;font-weight:600;margin-bottom:2px}
  .slot .h{font-size:12.5px;color:var(--muted);margin-bottom:4px}

  /* ---- the paper ---- */
  table.sec{width:100%;border-collapse:collapse;font-size:14px}
  table.sec th,table.sec td{border:1px solid var(--line-soft);padding:6px 8px;
       text-align:left;vertical-align:top}
  table.sec th{background:var(--paper);font-size:11px;letter-spacing:.06em;
       text-transform:uppercase;color:var(--muted)}
  table.sec td.m{text-align:right;font-weight:700;white-space:nowrap}
  a.out{color:var(--deep);font-weight:700}

  @media (max-height:640px){
    .rule{font-size:13px;line-height:1.4;max-height:5.4em;overflow:auto}
    .stem{font-size:20px;line-height:1.85} .hunt{font-size:20px}
    .para,.turn .ja{font-size:18px;line-height:1.9}
  }
  @media (max-width:760px){
    .bar{padding:6px 10px} .tool{padding:0 8px;font-size:12px}
    .steps button{min-width:80px} .steps b{font-size:13.5px}
    .feat{display:block} .feat .f{max-width:none;margin-bottom:2px}
    .turn .who{min-width:4.4em;font-size:11px}
  }
  @media (max-width:420px){
    .bar{gap:6px;padding:5px 9px}
    .bar h1{font-size:17px}
    .tool{min-height:32px;padding:0 7px;font-size:11.5px}
    .pts{min-height:32px;padding:0 8px;font-size:11.5px}
    .pts b{font-size:15px}
    .stem{font-size:19px} .opts button{font-size:19px;min-height:46px;min-width:62px}
  }
</style>
</head>
<body class="">
<div class="bar">
  <h1>ひっきしけん<span>Units 3 and 4 · written examination</span></h1>
  <div class="sp"></div>
  <div class="pts" id="pts" title="What you have got right on this device"><b id="ptsn">0</b> right</div>
  <button class="tool" id="furiBtn">ふりがな</button>
  <button class="tool" id="rateBtn" title="How fast the voices speak"><span id="rateLabel">×1</span></button>
  <button class="tool" id="saveBtn" title="Copy a line you can show someone">Save</button>
  <button class="tool" id="resetBtn">Reset</button>
</div>
<nav class="steps" id="steps"></nav>
<div class="pick" id="pick"></div>
<main id="main"></main>
<script src="data/exam.js?v=20261024a"></script>
<script src="data/drills.js?v=20261024a"></script>
<script src="data/texts.js?v=20261024a"></script>
<script src="data/writing.js?v=20261024a"></script>
<script src="data/readings.js?v=20261024a"></script>
<script src="data/audio.js?v=20261024a"></script>
<script src="app.js?v=20261024a"></script>
<div class="build" aria-hidden="true">build 2026-10-24a</div>
</body>
</html>
