  };

  /* ================= saying it out loud =================
     A recording always wins. `audio` on an item names a file in audio/, and
     that is the voice a student should be copying. Where there is no
     recording the device reads the Japanese itself, and where the device has
     no Japanese voice the button does not appear at all: a Japanese sentence
     in an English voice teaches the wrong thing, and silence is honest.
     Browsers publish the voice list late, so anything that asks early asks
     again when it lands. */
  var SAY = (function(){
    var can = "speechSynthesis" in window, jaV = null, settled = false, waiting = [];
    function find(){
      try {
        var vs = speechSynthesis.getVoices() || [];
        for (var i=0;i<vs.length;i++) if (/^ja(-|_|$)/i.test(vs[i].lang)) return vs[i];
      } catch (e){}
      return null;
    }
    function land(){
      jaV = find(); settled = true;
      document.body.classList.toggle("hasvoice", !!jaV);
      waiting.splice(0).forEach(function(f){ f(); });
    }
    if (can){
      try {
        if (speechSynthesis.getVoices().length) land();
        speechSynthesis.addEventListener("voiceschanged", land);
        setTimeout(land, 2000);
      } catch (e){ settled = true; }
    }
    var el = null;
    function stop(){
      try { if (el){ el.pause(); el = null; } } catch (e){}
      try { if (can) speechSynthesis.cancel(); } catch (e){}
    }
    return {
      hasJa: function(){ return !!jaV; },
      ready: function(f){ if (settled) f(); else waiting.push(f); },
      /* One thing plays at a time: two phrases over each other is noise. */
      play: function(it, ok, done){
        stop();
        if (it.audio){
          el = new Audio("audio/" + it.audio);
          el.onended = el.onerror = function(){ el = null; done(); };
          el.play().then(ok, function(){ el = null; done(); });
          return;
        }
        if (!jaV) return done();
        var u = new SpeechSynthesisUtterance(it.ja);
        u.voice = jaV; u.lang = "ja-JP"; u.rate = 0.85;
        u.onend = u.onerror = done;
        try { speechSynthesis.speak(u); ok(); } catch (e){ done(); }
      },
      stop: stop
    };
  })();

  /* Nothing to play, nothing to show: signs are read rather than said, and
     the ceremony speeches wait for a human voice rather than a synthetic one.
     Either still plays a recording the moment one is dropped in. */
  function sayBtn(it, i){
    if (!it.audio && (it.__say === false || !it.ja)) return "";
    return '<button class="say' + (it.audio ? " rec" : "") + '" data-say="' + i +
           '" aria-label="Play this phrase"><span class="spk" aria-hidden="true"></span></button>';
  }

  function groupHtml(g){
    var base = 0;
    for (var i=0;i<PHRASES.length;i++){
      if (PHRASES[i].id === g.id) break;
      base += PHRASES[i].items.length;
    }
    var h = head(g.ja, g.en) + '<p class="lede">' + esc(g.note) + '</p>';
    var anyKana = g.items.some(function(x){ return !!x.kana; });
    if (anyKana){
      h += '<button class="kanaswap' + (kanaOnly ? " on" : "") + '" data-kanaswap="1">' +
           (kanaOnly ? "\u6f22\u5b57\u3092\u3060\u3059<span class=\"en\">Put the kanji back</span>"
                     : "\u304b\u306a\u3060\u3051<span class=\"en\">All kana</span>") + '</button>';
    }
    h += '<div class="stack">';
    g.items.forEach(function(it, k){
      it.__say = g.say !== false;
      // `section` heads a run of items and belongs on the page. `label` names
      // one item and belongs inside its card. The speeches use the second.
      if (it.section) h += '<h3 class="psec">' + esc(it.section) + '</h3>';
      // The card is itself a button, so the play control cannot live inside
      // it. It sits over the corner as a sibling instead.
      h += '<div class="pwrap">' + sayBtn(it, base + k) +
           '<button class="phrase" data-ph="' + (base + k) + '">' +
             // A sign is a picture before it is a word, so it leads the card:
             // down a long list the drawing is what the eye catches first.
             (it.art && SIGNART[it.art]
                ? '<div class="signart">' + SIGNART[it.art] + '</div>' : "") +
             // A speech needs its occasion above it, not buried in the tip:
             // the student delivering it has to find theirs at a glance.
             (it.label ? '<div class="plabel">' + esc(it.label) + '</div>' : "") +
             (function(){
               // All-kana wins when it is switched on; otherwise the furigana
               // version if this item has one, and plain kanji if it does not.
               var kana = kanaOnly && it.kana;
               var body = kana ? it.kana : (it.furi || it.ja);
               var plain = kana ? it.kana : it.ja;
               return '<div class="jp' + (plain.indexOf("\n") > -1 ? " lines" : "") +
                      (!kana && it.furi ? " ruby" : "") + '">' +
                      (!kana && it.furi ? rubyHtml(body) : readable(body)) + '</div>';
             })() +
             '<div class="en">' + esc(it.en) + '</div>' +
             (it.tip ? '<div class="tip">' + esc(it.tip) + '</div>' : "") +
             (it.show ? '<div class="showtag">tap to show someone</div>' : "") +
           '</button></div>';
    });
    return h + '</div>';
  }

  /* ---- kana charts ----------------------------------------------------
     One image per script, drawn as an SVG so it stays sharp at any size and
     is precached with the rest of the app. The charts are the standard
     五十音表: columns read right to left from あ and finish at ん. The tab
     opens on the 46 alone so it is a quick check at a glance; the voiced
     set and the yoon are one tap further in rather than something to
     scroll past. All four images are precached. */
  var kanaScript = "hiragana", kanaExtra = false;
  function drawKana(){
    [].forEach.call(document.querySelectorAll("[data-kana]"), function(b){
      b.className = b.dataset.kana === kanaScript ? "on" : "";
    });
    var img = $("kanaImg"), name = kanaScript + (kanaExtra ? "-plus" : "");
    img.src = "kana-" + name + ".svg";
    img.alt = (kanaScript === "katakana" ? "Katakana" : "Hiragana") +
              (kanaExtra ? " voiced and small kana chart" : " chart");
    var b = $("kanaMore");
    b.className = kanaExtra ? "on" : "";
    b.firstChild.nodeValue = kanaExtra ? "\u2190 \u3054\u3058\u3085\u3046\u304a\u3093"
                                       : "\uff0b \u3060\u304f\u3066\u3093\u30fb\u3088\u3046\u304a\u3093";
    b.querySelector(".en").textContent = kanaExtra ? "Back to the 46"
                                                   : "Voiced and small kana";
  }
  /* A tap is a press and a release in the same place. Anything else is a
     scroll or a drag, and must not be read as "go back". */
  var dragged = false, downX = 0, downY = 0;
  document.addEventListener("pointerdown", function(e){
    dragged = false; downX = e.clientX; downY = e.clientY;
  }, { passive: true });
  document.addEventListener("pointerup", function(e){
    if (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 10) dragged = true;
  }, { passive: true });

  /* ---- swipe between sections ------------------------------------------
     Andrew: the tabs should not be something you scroll back up to reach.
     They are pinned to the top anyway, but on a phone a sideways swipe is
     the quicker move, so the whole page takes one. Inside a place, a swipe
     right goes back a level, which is what a thumb expects. A swipe only
     counts if it is clearly sideways, so it never fights normal scrolling. */
  var TAB_ORDER = ["places", "phrases", "manners", "home", "info"];
  var tsX = 0, tsY = 0, tsT = 0, tracking = false;
  document.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) { tracking = false; return; }
    if ($("kana").className === "on" || $("show").className === "on" ||
        $("sheet").className === "on"){
      tracking = false; return;
    }
    tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
    tsT = Date.now(); tracking = true;
  }, { passive: true });
  document.addEventListener("touchend", function(e){
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - tsX, dy = t.clientY - tsY;
    if (Date.now() - tsT > 700) return;            // a drag, not a flick
    if (Math.abs(dx) < 65 || Math.abs(dx) < Math.abs(dy) * 2) return;
    if (stack.length){ if (dx > 0) back(); return; }
    var cur = document.querySelector("nav button.on");
    var i = TAB_ORDER.indexOf(cur ? cur.dataset.go : "places");
    var n = i + (dx < 0 ? 1 : -1);
    if (n < 0 || n >= TAB_ORDER.length) return;    // no wrapping round
    goTab(TAB_ORDER[n]);
  }, { passive: true });

  function openKana(){
    kanaExtra = false;
    drawKana();
    $("kana").className = "on";
  }
  function closeKana(){ $("kana").className = ""; }

  /* ================= MANNERS ================= */
  function renderManners(){
    var h = head("マナー", "Etiquette") +
            '<p class="lede">How these things are usually done in Japan. Not a full ' +
            'list, just the ones that come up in the first couple of days. Tap one ' +
            'to read it.</p><div class="grid">';
    MANNERS.forEach(function(m, i){
      h += tile(m, 'data-manner="' + i + '"', "", i);
    });
    $("v-manners").innerHTML = h + '</div>';
  }
  /* It used to open under the whole grid, which meant tapping the first tile
     put the text somewhere below eight others, well off the screen. It takes
     over the screen now and closes on a tap anywhere, so there is nowhere for
     it to hide and nothing to scroll back from. */
  function openManner(i){
    var m = MANNERS[i]; if (!m) return;
    $("sheetBody").innerHTML =
      '<div class="sh">' + esc(m.ja) + '<span class="en">' + esc(m.en) +
      '</span></div><p>' + esc(m.body) + '</p>' +
      // Only ever an https link we put here ourselves. It needs signal, so
      // whatever matters is in the body text as well.
      (m.link && /^https:\/\//.test(m.link.url)
        ? '<p class="mlink"><a href="' + esc(m.link.url) + '" target="_blank" ' +
          'rel="noopener noreferrer">' + esc(m.link.label) + '</a></p>' : '');
    $("sheet").className = "on";
    $("sheet").scrollTop = 0;
  }
  function closeSheet(){ $("sheet").className = ""; }

  /* ================= navigation ================= */
  var BUILD = "Version 67, 26 September 2026";
  var TABS = { home:["りょてい","Itinerary"], places:["ばしょ","Places"],
               phrases:["ことば","Phrases"], manners:["マナー","Etiquette"],
               // The tab says Info because "Travel Information" will not sit on
               // one line on a 360px phone, and a label that wraps makes its
               // tab taller than the rest. The page it opens says the name in
               // full, in both scripts.
               info:["あんない","Travel Information"] };
  var stack = [];
  function setQuiet(on){ document.body.classList[on ? "add":"remove"]("quiet"); }
  // The trail: the tab, then every level above this one, then where you are.
  // Everything but the last is a button that jumps straight to that depth.
  function setHeader(ja, en){
    var h = "";
    if (stack.length){
      h += '<button data-depth="0">' + esc(TABS[curTab()][0]) + '</button>' +
           '<span class="sep">\u203a</span>';
      for (var i = 0; i < stack.length - 1; i++){
        h += '<button data-depth="' + (i + 1) + '">' + esc(stack[i].ja) + '</button>' +
             '<span class="sep">\u203a</span>';
      }
    }
    $("hja").innerHTML = h + esc(ja);
    $("hen").textContent = en;
  }
  function showView(id){
    ["home","places","phrases","manners","info","detail"].forEach(function(v){
      $("v-"+v).className = "view" + (v === id ? " on" : "");
    });
    window.scrollTo(0,0);
  }
  function curTab(){
    var c = document.querySelector("nav button.on");
    return c ? c.dataset.go : "places";
  }
  function showTab(name){
    closeSheet();
    setQuiet(false); showView(name);
    setHeader(TABS[name][0], TABS[name][1]);
    [].forEach.call(document.querySelectorAll("nav button"), function(b){
      b.className = b.dataset.go === name ? "on" : "";
    });
  }
  // Draws whatever is on top of the stack, or the current tab if it is empty,
  // and puts a labelled way back at the end of the page.
  function renderTop(){
    if (!stack.length) return showTab(curTab());
    var s = stack[stack.length-1];
    s.draw(); showView("detail"); setHeader(s.ja, s.en);
    var up = stack.length > 1 ? stack[stack.length-2]
                              : { ja: TABS[curTab()][0], en: TABS[curTab()][1] };
    $("v-detail").insertAdjacentHTML("afterbegin",
      '<button class="topback" data-upback="1">\u2039 ' + esc(up.ja) +
      '<span class="en">' + esc(up.en) + '</span></button>');
    $("v-detail").className = "view on" + (s.leaf ? " leaf" : "");
    if (s.leaf){
      $("v-detail").insertAdjacentHTML("beforeend",
        '<p class="tapout">Tap anywhere to go back to ' + esc(up.en) + '</p>');
    }
  }

  // Jump straight to a depth rather than stepping. 0 is the tab itself.
  function goDepth(target){
    var n = stack.length - target;
    if (n <= 0) return;
    if (history.state && history.state.d){ history.go(-n); return; }
    while (n--) fwd.push(stack.pop());
    renderTop();
  }

  /* Every level of depth is a real browser history entry, so the browser's own
     Back, Alt+Left, a mouse's back button and the phone's edge swipe all go up
     one level instead of leaving the app. The app's own Back goes through the
     browser too, so there is one path and the two cannot disagree. */
  // Levels stepped back out of are kept here, so Forward can step back in.
  var fwd = [];
  function push(draw, ja, en, leaf){
    fwd = [];
    stack.push({ draw: draw, ja: ja, en: en, leaf: !!leaf });
    renderTop();
    try { history.pushState({ d: stack.length }, ""); } catch (e){}
  }
  function back(){
    SAY.stop(); clearSay();
    if (!stack.length) return;
    if (history.state && history.state.d){ history.back(); return; }
    fwd.push(stack.pop()); renderTop();
  }
  // One handler for both directions: read the depth the browser has landed on
  // and make the stack match it. Popping only would send Forward to the tab
  // list instead of back down into the page you came from.
  window.addEventListener("popstate", function(e){
    var target = (e.state && e.state.d) || 0;
    while (stack.length > target) fwd.push(stack.pop());
    while (stack.length < target && fwd.length) stack.push(fwd.pop());
    renderTop();
  });
  function goTab(name){
    var n = stack.length;
    stack = []; fwd = [];
    showTab(name);
    // give the entries this depth owned back to the browser, so its Back does
    // not walk through pages the app has already left
    if (n) { try { history.go(-n); } catch (e){} }
  }

  document.addEventListener("click", function(e){
    var t;
    if ((t = e.target.closest("nav button"))) return goTab(t.dataset.go);
    if ((t = e.target.closest("[data-depth]"))) return goDepth(+t.dataset.depth);
    if (e.target.closest("[data-upback]")) return back();
    if ((t = e.target.closest("[data-place]"))){
      var r = find(t.dataset.place); if (!r) return;
      return push(function(){ setQuiet(r.p.tone === "quiet");
        $("v-detail").innerHTML = placeHtml(r.p); }, r.p.ja, r.p.en);
    }
    if ((t = e.target.closest("[data-sight]"))){
      var r2 = find(t.dataset.sight); if (!r2 || !r2.s) return;
      return push(function(){ setQuiet(r2.p.tone === "quiet");
        $("v-detail").innerHTML = sightHtml(r2.p, r2.s); }, r2.s.ja, r2.s.en);
    }
    if ((t = e.target.closest("[data-spot]"))){
      var r3 = find(t.dataset.spot); if (!r3 || !r3.sp) return;
      return push(function(){ setQuiet(r3.p.tone === "quiet");
        $("v-detail").innerHTML = spotHtml(r3.p, r3.s, r3.sp); },
        r3.sp.ja, r3.sp.en, true);
    }
    if ((t = e.target.closest("[data-group]"))){
      var g = PHRASES.filter(function(x){ return x.id === t.dataset.group; })[0];
      if (!g) return;
      return push(function(){ $("v-detail").innerHTML = groupHtml(g); }, g.ja, g.en);
    }
    // A tap anywhere on the sheet closes it, except on the one link it may
    // carry, which has somewhere else to go.
    if (e.target.closest("#sheet")){
      if (!e.target.closest("a")) closeSheet();
      return;
    }
    if ((t = e.target.closest("[data-manner]"))) return openManner(+t.dataset.manner);
    if ((t = e.target.closest("[data-ch]"))) return showRead(t);
    hideRead();
    if (e.target.closest("[data-questions]")){
      return push(function(){ $("v-detail").innerHTML = questionsHtml(); },
                  "しつもん と にっき", "The question and the journal");
    }
    if (e.target.closest("[data-money]")){
      return push(function(){ $("v-detail").innerHTML = moneyHtml(); },
                  MONEY.ja, MONEY.en);
    }
    if (e.target.closest("[data-sos]")){
      return push(function(){ $("v-detail").innerHTML = emergencyHtml(); },
                  EMERGENCY.ja, EMERGENCY.en);
    }
    if (e.target.closest("[data-preflight]")){
      return push(function(){ $("v-detail").innerHTML = preflightHtml(); },
                  PREFLIGHT.ja, PREFLIGHT.en);
    }
    if ((t = e.target.closest(".pftick"))){
      var row = t.closest("[data-pf]"), id = row.dataset.pf;
      var on = !row.classList.contains("done");
      row.classList.toggle("done", on);
      t.setAttribute("aria-pressed", on ? "true" : "false");
      pfSet(id, on);
      var c = $("pfcount");
      if (c) c.textContent = pfCount() + " of " + PREFLIGHT.items.length + " done";
      renderInfo();
      return;
    }
    if ((t = e.target.closest("[data-say]"))){
      e.stopPropagation();
      return playSay(t, phraseIndex[+t.dataset.say]);
    }
    if ((t = e.target.closest("[data-ph]"))) return openShow(phraseIndex[+t.dataset.ph]);
    if (e.target.closest("#showClose")) return closeShow();
    // Last page in a branch: the page itself is the way back. Ignore it if the
    // pointer travelled (a scroll or a drag), if text is selected, or if
    // something on the page wanted the tap.
    if (e.target.closest("#v-detail.leaf") &&
        !e.target.closest("button, a, [data-ch]") &&
        !dragged &&
        !(window.getSelection && String(window.getSelection()))) return back();
    if (e.target.closest("#kanatab")) return openKana();
    if (e.target.closest("#kanaClose")) return closeKana();
    if (e.target.closest("#kanaMore")){ kanaExtra = !kanaExtra; return drawKana(); }
    if (e.target.closest("[data-kanaswap]")){
      kanaOnly = !kanaOnly;
      if (stack.length) stack[stack.length - 1].draw();
      return;
    }
    if ((t = e.target.closest("[data-kana]"))){ kanaScript = t.dataset.kana; return drawKana(); }
  });

  /* The button marks itself while it is talking, so a student who taps twice
     can see why nothing new happened. */
  var sayingNow = null;
  function playSay(btn, it){
    if (!it) return;
    if (sayingNow === btn){ SAY.stop(); clearSay(); return; }
    clearSay();
    sayingNow = btn;
    SAY.play(it, function(){ btn.classList.add("on"); }, clearSay);
  }
  function clearSay(){
    if (sayingNow) sayingNow.classList.remove("on");
    sayingNow = null;
  }

  function openShow(it){
    if (!it) return;
    // A speech or an anthem verse does not fit at phrase size; step it down so
    // it can still be read at arm's length without three screens of scrolling.
    var jp = $("showJp"), n = it.ja.length;
    jp.textContent = it.ja;
    jp.className = "jp" + (n > 120 ? " verse" : n > 40 ? " long" : "");
    $("showEn").textContent = it.en;
    // Held up to a stranger, the phrase is worth hearing as well as reading.
    var i = phraseIndex.indexOf(it);
    $("showSay").innerHTML = i < 0 ? "" : sayBtn(it, i);
    $("show").className = "on";
  }
  function closeShow(){ SAY.stop(); clearSay(); $("show").className = ""; }
  document.addEventListener("input", function(e){
    if (e.target.id === "rateIn"){
      var v = parseFloat(e.target.value);
      if (v && v > 0 && v < 100000){ setRate(v); moneyRefresh(); }
      return;
    }
    if (e.target.id === "cvYen") return convFrom("yen");
    if (e.target.id === "cvAud") return convFrom("aud");
  });
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if ($("sheet").className === "on") closeSheet();
    else if ($("kana").className === "on") closeKana();
    else if ($("show").className === "on") closeShow();
    else if (stack.length) back();
  });

  /* ================= offline ================= */
  /* Registered only where it can work: a service worker needs http or https,
     so opening the file straight off a disk does nothing and errors nowhere.

     The update dance. The worker no longer jumps the queue on install, so a
     new one sits waiting and we can say so rather than swapping the app out
     from under somebody mid-sentence. Tapping the bar tells it to take over;
     that fires controllerchange, and we reload once. */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      function offer(){
        var bar = $("newver");
        if (!bar || !reg.waiting) return;
        bar.hidden = false;
        bar.onclick = function(){
          bar.hidden = true;
          reg.waiting.postMessage({ type: "SKIP_WAITING" });
        };
      }
      function watch(w){
        if (!w) return;
        w.addEventListener("statechange", function(){
          // A worker reaching "installed" with one already in charge means an
          // update. With nobody in charge it is simply the first install.
          if (w.state === "installed" && navigator.serviceWorker.controller) offer();
        });
      }
      if (reg.waiting && navigator.serviceWorker.controller) offer();
      watch(reg.installing);
      reg.addEventListener("updatefound", function(){ watch(reg.installing); });
    }).catch(function(){});

    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (reloading) return;      // controllerchange can fire more than once
      reloading = true;
      location.reload();
    });
  }
  /* Keyed to BUILD, not to a number typed here, so every release brings the
     Save button back by itself. It was pinned at v14 through thirty-odd
     releases, which meant a phone that saved once kept showing "Saved" and
     never fetched the photos added since. */
  var SAVED_KEY = "jtSaved-" + BUILD;
  function allPhotos(){
    var out = [];
    PLACES.forEach(function(p){ p.sights.forEach(function(s){
      [s].concat(s.spots).forEach(function(x){
        if (x.photo){ out.push(x.photo); out.push(x.photo.replace(/\.webp$/, "-t.webp")); }
        // A hero is never a tile, so it has no thumbnail, but it still has to
        // come down with everything else or it is a hole on the plane.
        if (x.hero) out.push(x.hero);
      });
    }); });
    return out.filter(function(v,i,a){ return a.indexOf(v) === i; });
  }
  function markSaved(msg){
    var box = $("save"); if (!box) return;
    var b = $("saveBtn"); if (b) b.remove();
    var d = box.querySelector(".done");
    if (!d){ d = document.createElement("div"); d.className = "done"; box.appendChild(d); }
    d.textContent = msg;
  }
  document.addEventListener("click", function(e){
    if (!e.target.closest("#saveBtn")) return;
    var btn = $("saveBtn");
    if (location.protocol.indexOf("http") !== 0){
      btn.disabled = true; btn.textContent = "Open this from its web address first"; return;
    }
    var list = allPhotos(), done = 0, failed = 0;
    btn.disabled = true; btn.textContent = "Saving 0 of " + list.length;
    Promise.all(list.map(function(u){
      return fetch(u, { cache: "reload" })
        .then(function(r){ if (!r.ok) failed++; }, function(){ failed++; })
        .then(function(){ done++; btn.textContent = "Saving " + done + " of " + list.length; });
    })).then(function(){
      if (failed){
        /* honest: a photo that did not arrive is not saved. Leave the button. */
        btn.disabled = false;
        btn.textContent = "Saved " + (list.length - failed) + " of " + list.length +
          " photos. Try again on wifi.";
        return;
      }
      try {
        Object.keys(localStorage).forEach(function(k){
          if (k.indexOf("jtSaved-") === 0 && k !== SAVED_KEY) localStorage.removeItem(k);
        });
        localStorage.setItem(SAVED_KEY, String(Date.now()));
      } catch(err){}
      markSaved("Saved. This app now works with no signal.");
    });
  });

  renderHome(); renderPlaces(); renderPhrases(); renderManners(); renderInfo();
  /* The key carries the app version, so after an update the button comes
     back and the new photos get saved too. Keep in step with CACHE in sw.js. */
  try { if (localStorage.getItem(SAVED_KEY)) markSaved("Saved. This app works with no signal."); }
  catch(err){}
  goTab("places");
})();
</script>
</body>
