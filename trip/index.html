<!DOCTYPE html>
<html lang="en-AU" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#f4efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>日本研修旅行 Japan Study Tour</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%A9%3C/text%3E%3C/svg%3E">
<style>
  /* Palette matches the Japanese Hub so the tools read as one suite. This one
     is used outdoors in September sun, so contrast is pushed harder than the
     desk apps and nothing important is carried by colour alone. */
  :root{
    --bg:#f4efe6; --paper:#fbf7ee; --ink:#1a1a1a; --muted:#5f574a;
    --line:#d8cfbb; --line-soft:#e8e0cd; --accent:#a83232;
    --deep:#16375e; --ok:#2f6a3e; --warn:#8a6d1e;
    --shadow:0 2px 10px rgba(0,0,0,.07);

    --font-en:Calibri,Carlito,'Segoe UI',Tahoma,Geneva,Verdana;
    --font-jp:'UD Digi Kyokasho N-R','UD Digi Kyokasho NP-R','UD Digi Kyokasho NK-R','UD デジタル教科書体 N-R','UDデジタル教科書体N-R','HGP教科書体','HG教科書体','YuKyokasho Yoko',YuKyokasho,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',YuGothic,Meiryo;
    --font:var(--font-en),var(--font-jp),sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.55;
       font-size:16px;padding-bottom:78px;overflow-wrap:break-word}

  /* ---------- chrome ---------- */
  header{position:sticky;top:0;z-index:40;background:var(--paper);
         border-bottom:1px solid var(--line);padding:10px 14px;
         padding-top:calc(10px + env(safe-area-inset-top));
         display:flex;align-items:center;gap:10px;min-height:52px}
  #back{border:1px solid var(--line);background:var(--bg);color:var(--ink);
        font-family:inherit;font-size:14px;padding:6px 11px;border-radius:8px;
        cursor:pointer;display:none;flex:0 0 auto}
  #back.on{display:block}
  .htitle{min-width:0;flex:1}
  .htitle .ja{font-size:15px;font-weight:700;line-height:1.25;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .htitle .en{font-size:11.5px;color:var(--muted);line-height:1.3;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  main{max-width:680px;margin:0 auto;padding:14px 14px 20px}
  .view{display:none}
  .view.on{display:block}

  /* ---------- shared bits ---------- */
  h2{font-size:19px;line-height:1.25;margin-bottom:2px}
  h2 .en{display:block;font-size:12.5px;font-weight:400;color:var(--muted);
         letter-spacing:.02em;margin-top:1px}
  .lede{color:var(--muted);font-size:14.5px;margin:8px 0 16px}
  .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.14em;
           text-transform:uppercase;color:var(--muted);margin:22px 0 9px}
  .eyebrow:first-child{margin-top:4px}

  .card{display:block;width:100%;text-align:left;background:var(--paper);
        border:1px solid var(--line);border-radius:12px;padding:14px;
        font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;
        box-shadow:var(--shadow)}
  .card:active{transform:scale(.995)}
  .stack{display:flex;flex-direction:column;gap:10px}
  .card .cja{font-size:17px;font-weight:700;line-height:1.3}
  .card .cen{font-size:13px;color:var(--muted);margin-top:1px}
  .card .cmeta{font-size:12px;color:var(--muted);margin-top:7px;
               padding-top:7px;border-top:1px solid var(--line-soft)}

  /* ---------- today strip ---------- */
  .today{background:var(--deep);color:#fbf7ee;border-radius:12px;padding:14px 15px;
         margin-bottom:16px;box-shadow:var(--shadow)}
  .today .lbl{font-size:10.5px;font-weight:800;letter-spacing:.14em;
              text-transform:uppercase;opacity:.72}
  .today .d{font-size:19px;font-weight:700;margin-top:5px;line-height:1.3}
  .today .d .en{display:block;font-size:13px;font-weight:400;opacity:.85;margin-top:1px}
  .today .nt{font-size:13.5px;margin-top:8px;padding-top:8px;
             border-top:1px solid rgba(251,247,238,.22);opacity:.93}

  /* ---------- day list ---------- */
  .day{display:grid;grid-template-columns:34px 1fr;gap:11px;padding:10px 0;
       border-bottom:1px solid var(--line-soft)}
  .day:last-child{border-bottom:0}
  .day .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
          padding-top:3px}
  .day.now .n{color:var(--accent);font-weight:800}
  .day .t{font-size:15px;font-weight:700}
  .day .t .en{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
  .day .nt{font-size:12.5px;color:var(--muted);margin-top:3px}
  .day.now{background:var(--paper);border-radius:10px;padding:10px 11px;
           border:1px solid var(--accent);border-bottom:1px solid var(--accent)}

  /* ---------- spot tiles: the tap targets at a sight ---------- */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (max-width:339px){.tiles{grid-template-columns:1fr}}
  .tile{display:flex;flex-direction:column;background:var(--paper);
        border:1px solid var(--line);border-radius:12px;overflow:hidden;
        font-family:inherit;text-align:left;color:var(--ink);cursor:pointer;
        box-shadow:var(--shadow)}
  .tile:active{transform:scale(.99)}
  /* size to content: a tile with a photo must not stretch the one beside it */
  .tile{align-self:start}
  .shot{flex:0 0 auto}
  /* photo slot. Andrew drops files in later; until then it is an honest,
     labelled placeholder rather than a broken image. */
  .shot{aspect-ratio:4/3;background:var(--bg);border-bottom:1px solid var(--line);
        display:flex;align-items:center;justify-content:center;position:relative}
  .shot{overflow:hidden}
  .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .shot.empty{aspect-ratio:auto;height:52px;background:var(--line-soft)}
  .bigshot.empty{aspect-ratio:auto;height:66px}
  .shot .ph{font-size:10.5px;color:var(--muted);letter-spacing:.1em;
            text-transform:uppercase;font-weight:700;opacity:.55}
  .tile .lab{padding:10px 12px 12px}
  .tile .lab .ja{font-size:15.5px;font-weight:700;line-height:1.3}
  .tile .lab .en{font-size:12.5px;color:var(--muted);margin-top:1px}

  /* ---------- quiet tone ----------
     A place can set tone:"quiet" in the content file. Hiroshima does. It cools
     the surface, drops the warm accent that carries the rest of the app, and
     swaps the go-and-do prompt for something to think about. The register has
     to change before a student has read a word, not after. */
  body.quiet,
  .quiet{--paper:#f2f1ef;--bg:#eceae7;--accent:#4a5560;--line:#cfcdc9;
         --line-soft:#e0deda;--muted:#5a5750}
  body.quiet{background:var(--bg)}
  body.quiet header{background:var(--paper);border-bottom-color:var(--line)}
  .quiet .look{border-left-width:3px;background:transparent}
  .quiet .hook{font-size:16px}
  .quiet .tone-note{background:transparent;border:1px solid var(--line);
        border-radius:10px;padding:13px 14px;margin:14px 0 2px;
        font-size:14.5px;color:var(--muted);line-height:1.6}

  /* ---------- spot detail ---------- */
  .hook{font-size:16.5px;line-height:1.62;margin:14px 0 0}
  .look{margin-top:16px;background:var(--paper);border:1px solid var(--accent);
        border-left-width:5px;border-radius:10px;padding:13px 14px}
  .look .lbl{font-size:10.5px;font-weight:800;letter-spacing:.13em;
             text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  .look p{font-size:15px;line-height:1.55}
  .bigshot{aspect-ratio:16/10;background:var(--paper);border:1px solid var(--line);
           border-radius:12px;display:flex;align-items:center;justify-content:center;
           margin-top:14px;overflow:hidden}
  .bigshot{position:relative}
  .bigshot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* A painting is not a photo: letterboxing a hanging scroll destroys it.
     fit:"contain" in the content file shows the work whole on a neutral
     ground instead of cropping it. */
  .bigshot.contain{aspect-ratio:4/3;background:var(--bg)}
  .bigshot.contain img{object-fit:contain}
  .shot.contain{background:var(--bg)}
  .shot.contain img{object-fit:contain}
  .credit{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
  .bigshot .ph{font-size:11px;color:var(--muted);letter-spacing:.1em;
               text-transform:uppercase;font-weight:700;opacity:.55}

  /* ---------- phrases ---------- */
  .ph-note{font-size:13.5px;color:var(--muted);margin:6px 0 12px}
  .phrase{width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
          border-radius:12px;padding:13px 14px;font-family:inherit;color:var(--ink);
          cursor:pointer;box-shadow:var(--shadow);display:block}
  .phrase .jp{font-size:19px;line-height:1.5;font-weight:600}
  .phrase .ro{font-size:13px;color:var(--muted);font-style:italic;margin-top:3px}
  .phrase .en{font-size:14.5px;margin-top:4px}
  .phrase .tip{font-size:13px;color:var(--muted);margin-top:8px;padding-top:8px;
               border-top:1px solid var(--line-soft)}
  .showtag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;
           text-transform:uppercase;color:var(--paper);background:var(--deep);
           border-radius:10px;padding:3px 8px;margin-top:9px}

  /* full-screen "hold this up" panel */
  #show{position:fixed;inset:0;z-index:90;background:var(--paper);display:none;
        flex-direction:column;padding:24px;padding-top:calc(24px + env(safe-area-inset-top))}
  #show.on{display:flex}
  #show .body{flex:1;display:flex;flex-direction:column;align-items:center;
              justify-content:center;text-align:center;gap:18px}
  #show .jp{font-size:34px;line-height:1.7;font-weight:700}
  #show .en{font-size:16px;color:var(--muted)}
  #show .hint{font-size:12.5px;color:var(--muted);letter-spacing:.05em;
              text-transform:uppercase;font-weight:700}
  #show button{border:1px solid var(--line);background:var(--bg);color:var(--ink);
               font-family:inherit;font-size:16px;padding:14px;border-radius:10px;
               cursor:pointer;width:100%}

  /* ---------- manners ---------- */
  .manner{background:var(--paper);border:1px solid var(--line);border-radius:12px;
          padding:13px 14px;box-shadow:var(--shadow)}
  .manner .h{font-size:16px;font-weight:700}
  .manner .h .en{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:7px}
  .manner p{font-size:14.5px;margin-top:5px}

  /* ---------- bottom nav ---------- */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
      border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
      padding-bottom:env(safe-area-inset-bottom)}
  nav button{border:0;background:none;font-family:inherit;color:var(--muted);
             padding:9px 2px 10px;cursor:pointer;border-top:3px solid transparent}
  nav button .ja{display:block;font-size:14px;font-weight:700;line-height:1.25}
  nav button .en{display:block;font-size:10px;letter-spacing:.03em}
  nav button.on{color:var(--accent);border-top-color:var(--accent)}

  /* ---------- offline ---------- */
  .save{background:var(--paper);border:1px solid var(--line);border-radius:12px;
        padding:14px;margin-top:18px;box-shadow:var(--shadow)}
  .save h3{font-size:15px;font-weight:700}
  .save h3 .en{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:6px}
  .save p{font-size:13.5px;color:var(--muted);margin-top:5px}
  .save button{margin-top:11px;width:100%;padding:13px;border-radius:10px;
        border:1px solid var(--deep);background:var(--deep);color:#fbf7ee;
        font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .save button[disabled]{opacity:.55;cursor:default}
  .save .done{margin-top:11px;padding:11px 12px;border-radius:10px;
        border:1px solid var(--ok);color:var(--ok);font-size:13.5px;font-weight:600}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:26px;
        line-height:1.6}
  :focus-visible{outline:3px solid var(--deep);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <button id="back" aria-label="Back">‹ もどる</button>
  <div class="htitle">
    <div class="ja" id="hja">日本研修旅行</div>
    <div class="en" id="hen">Japan Study Tour 2026</div>
  </div>
</header>

<main>
  <div class="view on" id="v-home"></div>
  <div class="view" id="v-places"></div>
  <div class="view" id="v-phrases"></div>
  <div class="view" id="v-manners"></div>
  <div class="view" id="v-detail"></div>
</main>

<nav>
  <button data-go="home"    class="on"><span class="ja">きょう</span><span class="en">Today</span></button>
  <button data-go="places"><span class="ja">ばしょ</span><span class="en">Places</span></button>
  <button data-go="phrases"><span class="ja">ことば</span><span class="en">Phrases</span></button>
  <button data-go="manners"><span class="ja">マナー</span><span class="en">Manners</span></button>
</nav>

<div id="show" role="dialog" aria-modal="true" aria-label="Show this to someone">
  <div class="body">
    <div class="hint">Hold this up</div>
    <div class="jp" id="showJp"></div>
    <div class="en" id="showEn"></div>
  </div>
  <button id="showClose">とじる  Close</button>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }
  // Bilingual heading, Japanese first. Andrew's rule, applied in one place.
  function head(ja, en){
    return '<h2>' + esc(ja) + '<span class="en">' + esc(en) + '</span></h2>';
  }
  function shot(photo, cls, fit){
    if (photo){
      // tiles are ~180px wide, so they take the -t copy and save the bandwidth
      var src = (cls === "shot") ? photo.replace(/\.webp$/, "-t.webp") : photo;
      // A self-contained copy (for review off the server) can carry its photos
      // inline in window.PHOTOS. On the real site that map does not exist and
      // the ordinary file path is used.
      if (window.PHOTOS && window.PHOTOS[src]) src = window.PHOTOS[src];
      return '<div class="' + cls + (fit === "contain" ? " contain" : "") +
             '"><img src="' + esc(src) + '" alt="" loading="lazy"></div>';
    }
    return '<div class="' + cls + ' empty"><span class="ph">photo to come</span></div>';
  }

  /* ---- where are we up to ---- */
  function todayIndex(){
    var now = new Date();
    var t = now.getFullYear() + "-" +
            String(now.getMonth()+1).padStart(2,"0") + "-" +
            String(now.getDate()).padStart(2,"0");
    for (var i=0;i<TRIP.days.length;i++){ if (TRIP.days[i].date === t) return i; }
    return -1;
  }
  function daysUntil(){
    var now = new Date(); now.setHours(0,0,0,0);
    var dep = new Date(TRIP.start + "T00:00:00");
    return Math.round((dep - now) / 86400000);
  }

  /* ---- history so the phone's back button and our back button agree ---- */
  var stack = [];
  function setHeader(ja, en, canBack){
    $("hja").textContent = ja;
    $("hen").textContent = en;
    $("back").className = canBack ? "on" : "";
  }
  function setQuiet(on){
    document.body.classList[on ? "add" : "remove"]("quiet");
  }
  function showView(id){
    ["home","places","phrases","manners","detail"].forEach(function(v){
      $("v-"+v).className = "view" + (v === id ? " on" : "");
    });
    window.scrollTo(0,0);
  }

  /* ================= HOME ================= */
  function renderHome(){
    var i = todayIndex(), h = "";
    if (i > -1){
      var d = TRIP.days[i];
      h += '<div class="today"><div class="lbl">きょう  Today</div>' +
           '<div class="d">' + esc(d.ja) + '<span class="en">Day ' + d.n + ' of 12: ' + esc(d.en) + '</span></div>' +
           '<div class="nt">' + esc(d.note) + '</div></div>';
    } else {
      var n = daysUntil();
      var line = n > 0 ? (n === 1 ? "Tomorrow." : n + " days to go.")
                       : "The tour is over. Welcome home.";
      h += '<div class="today"><div class="lbl">しゅっぱつまで  Departure</div>' +
           '<div class="d">' + esc(line) +
           '<span class="en">Melbourne, 20 September 2026, 18:25</span></div>' +
           '<div class="nt">Open this on the day and it will show you where we are up to.</div></div>';
    }

    h += '<div class="eyebrow">りょてい  The trip</div><div>';
    TRIP.days.forEach(function(d, k){
      h += '<div class="day' + (k === i ? " now" : "") + '">' +
             '<div class="n">' + d.n + '</div>' +
             '<div><div class="t">' + esc(d.ja) + '<span class="en">' + esc(d.en) + '</span></div>' +
             '<div class="nt">' + esc(d.note) + '</div></div></div>';
    });
    h += '</div>';
    h += '<div class="save" id="save">' +
           '<h3>オフライン<span class="en">Save for offline</span></h3>' +
           '<p>Press this on hotel or home wifi before you go out for the day. ' +
           'It stores every page and photo on your phone, so the app still ' +
           'works with no signal and no data.</p>' +
           '<button id="saveBtn">ぜんぶ保存する  Save it all</button>' +
         '</div>';
    h += '<p class="foot">Everything in here works with no internet once the page ' +
         'has loaded.<br>Meeting points, phone numbers and your emergency details ' +
         'are on your lanyard, not in this app.</p>';
    $("v-home").innerHTML = h;
  }

  /* ================= PLACES ================= */
  function renderPlaces(){
    var h = head("ばしょ", "Places we are going") +
            '<p class="lede">Tap a place, then tap the thing you are standing in ' +
            'front of.</p><div class="stack">';
    PLACES.forEach(function(p){
      var n = p.sights.reduce(function(a,s){ return a + s.spots.length; }, 0);
      h += '<button class="card" data-place="' + esc(p.id) + '">' +
             '<div class="cja">' + esc(p.ja) + '</div>' +
             '<div class="cen">' + esc(p.en) + '</div>' +
             '<div class="cmeta">' + esc(p.days) + '  ·  ' + n + ' things to find</div>' +
           '</button>';
    });
    $("v-places").innerHTML = h + '</div>';
  }

  function placeHtml(p){
    var h = '<div' + (p.tone === "quiet" ? ' class="quiet"' : '') + '>' +
            head(p.ja, p.en) + '<p class="lede">' + esc(p.intro) + '</p>' +
            (p.note ? '<div class="tone-note">' + esc(p.note) + '</div>' : '');
    p.sights.forEach(function(s){
      h += '<div class="eyebrow">' + esc(s.ja) + '  ' + esc(s.en) + '</div>' +
           '<p class="ph-note">' + esc(s.intro) + '</p><div class="tiles">';
      s.spots.forEach(function(sp){
        h += '<button class="tile" data-spot="' + esc(p.id + "/" + s.id + "/" + sp.id) + '">' +
               shot(sp.photo, "shot", sp.fit) +
               '<div class="lab"><div class="ja">' + esc(sp.ja) + '</div>' +
               '<div class="en">' + esc(sp.en) + '</div></div>' +
             '</button>';
      });
      h += '</div>';
    });
    return h + '</div>';
  }

  function openPlace(id){
    var p = PLACES.filter(function(x){ return x.id === id; })[0];
    if (!p) return;
    push(function(){ setQuiet(p.tone === "quiet"); $("v-detail").innerHTML = placeHtml(p); }, p.ja, p.en);
  }

  function openSpot(path){
    var bits = path.split("/");
    var p = PLACES.filter(function(x){ return x.id === bits[0]; })[0];
    if (!p) return;
    var s = p.sights.filter(function(x){ return x.id === bits[1]; })[0];
    if (!s) return;
    var sp = s.spots.filter(function(x){ return x.id === bits[2]; })[0];
    if (!sp) return;
    push(function(){ setQuiet(p.tone === "quiet"); $("v-detail").innerHTML = spotHtml(p, s, sp); }, sp.ja, sp.en);
  }

  function spotHtml(p, s, sp){
    var quiet = p.tone === "quiet";
    var lbl = quiet ? "かんがえてみよう  Something to think about"
                    : "やってみよう  Go and do this";
    return '<div' + (quiet ? ' class="quiet"' : '') + '>' + head(sp.ja, sp.en) +
            '<p class="ph-note">' + esc(s.ja) + '  ' + esc(s.en) + '</p>' +
            shot(sp.photo, "bigshot", sp.fit) +
            (sp.credit ? '<p class="credit">' + esc(sp.credit) + '</p>' : "") +
            '<p class="hook">' + esc(sp.hook) + '</p>' +
            '<div class="look"><div class="lbl">' + esc(lbl) + '</div>' +
            '<p>' + esc(sp.look) + '</p></div></div>';
  }

  /* ================= PHRASES ================= */
  var phraseIndex = [];
  function renderPhrases(){
    phraseIndex = [];
    var h = head("ことば", "Phrases") +
            '<p class="lede">Tap any phrase to blow it up big enough to hold in ' +
            'front of someone.</p>';
    PHRASES.forEach(function(g){
      h += '<div class="eyebrow">' + esc(g.ja) + '  ' + esc(g.en) + '</div>' +
           '<p class="ph-note">' + esc(g.note) + '</p><div class="stack">';
      g.items.forEach(function(it){
        var k = phraseIndex.push(it) - 1;
        h += '<button class="phrase" data-ph="' + k + '">' +
               '<div class="jp">' + esc(it.ja) + '</div>' +
               '<div class="ro">' + esc(it.ro) + '</div>' +
               '<div class="en">' + esc(it.en) + '</div>' +
               (it.tip ? '<div class="tip">' + esc(it.tip) + '</div>' : "") +
               (it.show ? '<div class="showtag">show this to someone</div>' : "") +
             '</button>';
      });
      h += '</div>';
    });
    $("v-phrases").innerHTML = h;
  }

  /* ================= MANNERS ================= */
  function renderManners(){
    var h = head("マナー", "Manners that actually come up") +
            '<p class="lede">Not a full list. These are the ones that will happen ' +
            'to you in the first two days.</p><div class="stack">';
    MANNERS.forEach(function(m){
      h += '<div class="manner"><div class="h">' + esc(m.ja) +
           '<span class="en">' + esc(m.en) + '</span></div>' +
           '<p>' + esc(m.body) + '</p></div>';
    });
    $("v-manners").innerHTML = h + '</div>';
  }

  /* ================= navigation ================= */
  var TABS = {
    home:    ["日本研修旅行", "Japan Study Tour 2026"],
    places:  ["ばしょ", "Places"],
    phrases: ["ことば", "Phrases"],
    manners: ["マナー", "Manners"]
  };
  function goTab(name){
    stack = [];
    setQuiet(false);
    showView(name);
    setHeader(TABS[name][0], TABS[name][1], false);
    [].forEach.call(document.querySelectorAll("nav button"), function(b){
      b.className = b.dataset.go === name ? "on" : "";
    });
  }
  // Each layer knows how to draw itself, so going back is just: draw the one
  // underneath again. No cached HTML, nothing to get out of step.
  function push(draw, ja, en){
    stack.push({ draw: draw, ja: ja, en: en });
    draw();
    showView("detail");
    setHeader(ja, en, true);
  }
  function back(){
    stack.pop();
    if (stack.length){
      var s = stack[stack.length-1];
      s.draw();
      showView("detail");
      setHeader(s.ja, s.en, true);
    } else {
      var cur = document.querySelector("nav button.on");
      goTab(cur ? cur.dataset.go : "home");
    }
  }

  document.addEventListener("click", function(e){
    var t;
    if ((t = e.target.closest("nav button")))       return goTab(t.dataset.go);
    if ((t = e.target.closest("#back")))            return back();
    if ((t = e.target.closest("[data-place]")))     return openPlace(t.dataset.place);
    if ((t = e.target.closest("[data-spot]")))      return openSpot(t.dataset.spot);
    if ((t = e.target.closest("[data-ph]")))        return openShow(phraseIndex[+t.dataset.ph]);
    if (e.target.closest("#showClose"))             return closeShow();
  });

  function openShow(it){
    if (!it) return;
    $("showJp").textContent = it.ja;
    $("showEn").textContent = it.en;
    $("show").className = "on";
  }
  function closeShow(){ $("show").className = ""; }
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ if ($("show").className === "on") closeShow(); else if (stack.length) back(); }
  });

  /* ---- offline ----
     The service worker caches whatever is fetched. This button walks every
     photo in the content so nothing is left to chance out on the road. It
     needs a real server, so over file:// it says so honestly instead of
     pretending to work. */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }

  function allPhotos(){
    var out = [];
    PLACES.forEach(function(p){ p.sights.forEach(function(s){
      [s].concat(s.spots).forEach(function(x){
        if (x.photo){ out.push(x.photo); out.push(x.photo.replace(/\.webp$/, "-t.webp")); }
      });
    }); });
    return out.filter(function(v,i,a){ return a.indexOf(v) === i; });
  }

  function markSaved(msg){
    var box = $("save");
    if (!box) return;
    var b = $("saveBtn");
    if (b) b.remove();
    var d = box.querySelector(".done");
    if (!d){ d = document.createElement("div"); d.className = "done"; box.appendChild(d); }
    d.textContent = msg;
  }

  document.addEventListener("click", function(e){
    if (!e.target.closest("#saveBtn")) return;
    var btn = $("saveBtn");
    if (location.protocol.indexOf("http") !== 0){
      btn.disabled = true;
      btn.textContent = "Open this from its web address first";
      return;
    }
    var list = allPhotos(), done = 0;
    btn.disabled = true;
    btn.textContent = "Saving 0 of " + list.length;
    Promise.all(list.map(function(u){
      return fetch(u, { cache: "reload" })
        .catch(function(){ return null; })
        .then(function(){ done++; btn.textContent = "Saving " + done + " of " + list.length; });
    })).then(function(){
      try { localStorage.setItem("jtSaved", String(Date.now())); } catch(err){}
      markSaved("Saved. This app now works with no signal.");
    });
  });

  renderHome(); renderPlaces(); renderPhrases(); renderManners();
  try {
    if (localStorage.getItem("jtSaved")) markSaved("Saved. This app works with no signal.");
  } catch(err){}
  goTab("home");
})();
</script>
</body>
</html>
