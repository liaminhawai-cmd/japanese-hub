<!DOCTYPE html>
<html lang="en-AU" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#e3c274">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>日本研修旅行 Japan Study Tour</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%A9%3C/text%3E%3C/svg%3E">
<style>
  /* Read standing up, outdoors, in September sun, by a 13 year old holding a
     phone in one hand. That drives every size in here: nothing below 15px,
     body copy at 18, and tap targets you cannot miss. Menus live at the TOP
     because that is where a thumb looks first on a page you are reading. */
  :root{
    /* The ground is a pale gold leaf, the colour of a 金地 screen rather
       than metallic gold: warm enough to read as gold, light enough to keep
       black text and the pale tiles comfortable on top of it. Hiroshima
       overrides all of this back to a cool grey (see the quiet block). */
    --bg:#e3c274; --paper:#fffdf4; --ink:#1e1a10; --muted:#453a20;
    --line:#d4be8c; --line-soft:#e2d2a9; --accent:#a83232;
    --deep:#16375e; --ok:#2f6a3e;
    /* Tile blocks, from the traditional palette and kept pale so black text
       sits on them comfortably: asagi, sakura, wakatake, fuji, yamabuki,
       sora, matcha, toki. Tiles cycle through these by position. The
       two that used to be warm yellows, yamabuki and matcha, are a coral
       and a deeper green here: against a gold ground a pale yellow tile
       stops reading as a tile at all. */
    --c1:#d9edf1; --c2:#fbe3e8; --c3:#dcecdc; --c4:#e4e1f0;
    --c5:#f6d9c8; --c6:#dde9f5; --c7:#dbe6c2; --c8:#f7e3e6;
    --shadow:0 2px 10px rgba(0,0,0,.08);

    --font-en:Calibri,Carlito,'Segoe UI',Tahoma,Geneva,Verdana;
    --font-jp:'UD Digi Kyokasho N-R','UD Digi Kyokasho NP-R','UD Digi Kyokasho NK-R','UD デジタル教科書体 N-R','UDデジタル教科書体N-R','HGP教科書体','HG教科書体','YuKyokasho Yoko',YuKyokasho,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',YuGothic,Meiryo;
    --font:var(--font-en),var(--font-jp),sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  /* Real leaf, not a grid of squares: a seamless photographic tile drawn by
     tools/make-gold-leaf.py. --bg is the fallback, and is the texture's own
     mean colour, so a phone that never loads the image still gets gold. The
     tile is 1024px shown at 512, which keeps it sharp on a 2x screen. */
  body{font-family:var(--font);background:var(--bg);color:var(--ink);
       line-height:1.6;font-size:18px;overflow-wrap:break-word;
       background-image:url("gold-leaf.webp");
       background-size:512px 512px;background-repeat:repeat}

  /* ---------- top bar: title, then the menu ---------- */
  .top{position:sticky;top:0;z-index:40;background:var(--paper);
       border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .navline{border-top:1px solid var(--line-soft)}
  .bar{display:flex;align-items:center;gap:12px;padding:10px 14px 9px;min-height:56px}
  #back{border:1px solid var(--line);background:var(--bg);color:var(--ink);
        font-family:inherit;font-size:16px;font-weight:600;padding:9px 14px;
        border-radius:10px;cursor:pointer;display:none;flex:0 0 auto}
  #back.on{display:block}
  .htitle{min-width:0;flex:1}
  .htitle .ja{font-size:18px;font-weight:700;line-height:1.25;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .htitle .en{font-size:14px;color:var(--muted);line-height:1.3;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  nav{display:flex;justify-content:center;gap:22px;max-width:680px;margin:0 auto;
      padding:0 14px;background:var(--paper)}
  nav button{border:0;background:none;font-family:inherit;color:var(--muted);
             padding:9px 1px 8px;cursor:pointer;border-bottom:4px solid transparent}
  nav button .en{display:block;font-size:16px;font-weight:700;line-height:1.2}
  nav button .ja{display:block;font-size:12px;opacity:.75;line-height:1.35}
  nav button.on{color:var(--accent);border-bottom-color:var(--accent)}

  main{max-width:680px;margin:0 auto;padding:16px 14px 40px}
  .view{display:none}
  .view.on{display:block}

  /* ---------- shared ---------- */
  h2{font-size:25px;line-height:1.2;margin-bottom:3px}
  h2 .en{display:block;font-size:16px;font-weight:400;color:var(--muted);margin-top:2px}
  .lede{color:var(--muted);font-size:16.5px;margin:10px 0 18px}
  /* a big, unmissable section heading, used for the itinerary */
  .sec{font-size:24px;font-weight:700;margin:26px 0 4px;line-height:1.2}
  .sec .en{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:1px}
  /* the panel a manner drops open into */
  .drop{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--accent);
        border-radius:12px;padding:15px 16px;margin-top:12px}
  .drop .h{font-size:20px;font-weight:700}
  .drop .h .en{font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
  .drop p{font-size:17.5px;margin-top:7px;line-height:1.6}
  .gt.sel{outline:3px solid var(--accent);outline-offset:2px}
  .stack{display:flex;flex-direction:column;gap:12px}

  /* big, obvious rows: places, and the sights inside a place */
  .row{display:block;width:100%;text-align:left;background:var(--paper);
       border:1px solid var(--line);border-radius:14px;padding:16px 17px;
       font-family:inherit;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);
       position:relative;padding-right:44px}
  .row:active{transform:scale(.995)}
  .row .rja{font-size:21px;font-weight:700;line-height:1.3}
  .row .ren{font-size:15.5px;color:var(--muted);margin-top:2px}
  .row .rmeta{font-size:14px;color:var(--muted);margin-top:9px;
              padding-top:9px;border-top:1px solid var(--line-soft)}
  .row::after{content:"›";position:absolute;right:17px;top:50%;
              transform:translateY(-50%);font-size:26px;color:var(--line);
              line-height:1}

  /* ---------- today ---------- */
  .today{background:var(--deep);color:#fbf7ee;border-radius:14px;padding:17px 18px;
         margin-bottom:18px;box-shadow:var(--shadow)}
  .today .lbl{font-size:12px;font-weight:800;letter-spacing:.13em;
              text-transform:uppercase;opacity:.75}
  .today .d{font-size:23px;font-weight:700;margin-top:6px;line-height:1.28}
  .today .d .en{display:block;font-size:15.5px;font-weight:400;opacity:.9;margin-top:3px}
  .today .nt{font-size:16px;margin-top:11px;padding-top:11px;
             border-top:1px solid rgba(251,247,238,.25);opacity:.95}

  .day{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0;
       border-bottom:1px solid var(--line-soft)}
  .day:last-child{border-bottom:0}
  .day .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
  .day.now .n{color:var(--accent);font-weight:800}
  .day .t{font-size:18px;font-weight:700}
  .day .t .en{display:block;font-size:15px;font-weight:400;color:var(--muted)}
  .day .nt{font-size:15px;color:var(--muted);margin-top:4px}
  .day.now{background:var(--paper);border-radius:12px;padding:12px 13px;
           border:1px solid var(--accent)}

  /* ---------- tiles: one component for places, sights and spots ----------
     Fixed height so the grid stays even whether or not a photo exists, and
     small enough that a screen holds six of them. Block colour instead of a
     white card, because a wall of white cards is what made this dull. */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .gt{height:138px;display:flex;flex-direction:column;overflow:hidden;
      border-radius:13px;border:1px solid rgba(0,0,0,.07);cursor:pointer;
      font-family:inherit;text-align:left;color:var(--ink);padding:0;
      box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .gt:active{transform:scale(.985)}
  .gt .ph{flex:1;position:relative;overflow:hidden;min-height:0}
  .gt .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .gt .ph.contain img{object-fit:contain;background:rgba(255,255,255,.5)}
  /* no photo: the Japanese name carries the tile */
  .gt .big{flex:1;display:flex;align-items:center;justify-content:center;
           padding:6px 8px 0;min-height:0}
  .gt .big span{font-size:34px;line-height:1.15;text-align:center;opacity:.9}
  .gt .big span.s3{font-size:28px}
  .gt .big span.s4{font-size:23px}
  .gt .big span.s5{font-size:18px}
  .gt .lab{padding:8px 11px 10px}
  .gt .lab .ja{font-size:15.5px;font-weight:700;line-height:1.25;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gt .lab .en{font-size:12.5px;line-height:1.3;opacity:.72;margin-top:1px;
               display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
               overflow:hidden}
  .gt .lab .en.solo{font-size:14px;font-weight:600;opacity:.85;-webkit-line-clamp:2}
  .gt .lab .meta{font-size:11px;opacity:.62;margin-top:3px}

  /* ---------- spot detail ---------- */
  .hook{font-size:19px;line-height:1.68;margin:16px 0 0}
  .look{margin-top:20px;background:var(--paper);border:1px solid var(--accent);
        border-left-width:6px;border-radius:12px;padding:15px 16px}
  .look .lbl{font-size:12px;font-weight:800;letter-spacing:.12em;
             text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .look p{font-size:17.5px;line-height:1.6}
  .bigshot{aspect-ratio:16/10;background:var(--paper);border:1px solid var(--line);
           border-radius:14px;margin-top:16px;overflow:hidden;position:relative}
  .bigshot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bigshot.contain{aspect-ratio:4/3;background:var(--bg)}
  .bigshot.contain img{object-fit:contain}
  /* ---------- maps ---------- */
  .maps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;align-items:start}
  .mp.wide{grid-column:1 / -1}
  .mp{background:#dde9f5;border:1px solid var(--line);border-radius:12px;
      padding:8px;position:relative;overflow:hidden}
  .mp svg{display:block;width:100%;height:auto}
  .mp .cap{font-size:11.5px;color:var(--muted);text-align:center;margin-top:5px;
           font-weight:600;letter-spacing:.02em}
  .credit{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.5}
  .where{font-size:15px;color:var(--muted);margin-top:4px}

  /* ---------- quiet tone (Hiroshima) ---------- */
  body.quiet,
  .quiet{--paper:#f2f1ef;--bg:#eceae7;--accent:#4a5560;--line:#c9c7c3;
         --line-soft:#dedcd8;--muted:#524f49}
  body.quiet{background:var(--bg);background-image:none}
  body.quiet .top{background:var(--paper);border-bottom-color:var(--line)}
  .quiet .look{border-left-width:4px;background:transparent}
  body.quiet .gt{background:#e6e6e4!important;border-color:rgba(0,0,0,.09)}
  .quiet .tone-note{background:transparent;border:1px solid var(--line);
        border-radius:12px;padding:15px 16px;margin:16px 0 4px;
        font-size:16.5px;color:var(--muted);line-height:1.62}

  /* ---------- phrases ---------- */
  .grp{margin-top:26px}
  .grp:first-of-type{margin-top:6px}
  .grp h3{font-size:20px;font-weight:700}
  .grp h3 .en{font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
  .grp .note{font-size:15.5px;color:var(--muted);margin:5px 0 13px}
  .phrase{width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
          border-radius:14px;padding:15px 16px;font-family:inherit;color:var(--ink);
          cursor:pointer;box-shadow:var(--shadow);display:block}
  .phrase .jp{font-size:24px;line-height:1.5;font-weight:600}
  .phrase .en{font-size:17px;margin-top:6px}
  .phrase .tip{font-size:15px;color:var(--muted);margin-top:10px;padding-top:10px;
               border-top:1px solid var(--line-soft)}
  .showtag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;
           text-transform:uppercase;color:var(--paper);background:var(--deep);
           border-radius:12px;padding:5px 11px;margin-top:11px}

  /* ---------- kana charts ----------
     A tab down the right edge of every screen. It sits under the two
     full-screen panels, which are opaque, so it disappears on its own
     when one of them is open. */
  /* iOS Safari does not lay a button out reliably with writing-mode, and
     without -webkit-appearance:none it repaints one in its own style. So the
     tab is stacked one character per line instead of rotated, and every
     default button style is turned off explicitly. */
  #kanatab{position:fixed;right:0;top:52%;transform:translateY(-50%);z-index:80;
        -webkit-appearance:none;appearance:none;
        background:var(--deep);color:#fbf7ee;
        border:0;border-radius:13px 0 0 13px;padding:13px 9px;font-family:inherit;
        font-size:16px;font-weight:700;line-height:1.18;cursor:pointer;
        display:block;width:auto;text-align:center;
        box-shadow:-2px 2px 10px rgba(0,0,0,.22)}
  #kanatab span{display:block}

  #kana{position:fixed;inset:0;z-index:95;background:var(--bg);display:none;
        flex-direction:column;padding-top:env(safe-area-inset-top)}
  #kana.on{display:flex}
  #kana .kbar{display:flex;gap:8px;align-items:center;padding:11px 12px;
        background:var(--paper);border-bottom:1px solid var(--line)}
  #kana .kbar button{flex:1;padding:12px 8px;border-radius:11px;border:1px solid var(--line);
        background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px;
        font-weight:700;cursor:pointer}
  #kana .kbar button.on{background:var(--deep);border-color:var(--deep);color:#fbf7ee}
  #kana .kbar #kanaClose{flex:0 0 auto;width:46px;font-size:22px;font-weight:400}
  /* The whole chart has to be visible at once, so the image is fitted to
     whatever room is left rather than scrolled. */
  #kana .kwrap{flex:1;min-height:0;display:flex;align-items:center;
        justify-content:center;padding:8px 8px 4px}
  #kana .kmore{flex:0 0 auto;padding:6px 10px calc(12px + env(safe-area-inset-bottom))}
  #kana .kmore button{width:100%;padding:12px;border-radius:11px;
        border:1px solid var(--line);background:var(--paper);color:var(--ink);
        font-family:inherit;font-size:15.5px;font-weight:600;cursor:pointer;
        -webkit-appearance:none;appearance:none;line-height:1.25}
  #kana .kmore .en{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
  #kana .kmore button.on .en{color:rgba(251,247,238,.8)}
  #kana .kmore button.on{background:var(--deep);border-color:var(--deep);color:#fbf7ee}
  #kana .kwrap img{max-width:100%;max-height:100%;width:auto;height:auto;
        display:block;border-radius:12px}

  #show{position:fixed;inset:0;z-index:90;background:var(--paper);display:none;
        flex-direction:column;padding:24px;padding-top:calc(24px + env(safe-area-inset-top))}
  #show.on{display:flex}
  #show .body{flex:1;display:flex;flex-direction:column;align-items:center;
              justify-content:center;text-align:center;gap:20px}
  #show .jp{font-size:38px;line-height:1.65;font-weight:700}
  #show .en{font-size:18px;color:var(--muted)}
  #show .hint{font-size:13px;color:var(--muted);letter-spacing:.09em;
              text-transform:uppercase;font-weight:800}
  #show button{border:1px solid var(--line);background:var(--bg);color:var(--ink);
               font-family:inherit;font-size:18px;font-weight:600;padding:16px;
               border-radius:12px;cursor:pointer;width:100%}

  /* ---------- manners ---------- */
  .manner{background:var(--paper);border:1px solid var(--line);border-radius:14px;
          padding:15px 16px;box-shadow:var(--shadow)}
  .manner .h{font-size:19px;font-weight:700}
  .manner .h .en{font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
  .manner p{font-size:17px;margin-top:6px}

  /* ---------- offline ---------- */
  .save{background:var(--paper);border:1px solid var(--line);border-radius:14px;
        padding:16px;margin-top:22px;box-shadow:var(--shadow)}
  .save h3{font-size:18px;font-weight:700}
  .save h3 .en{font-size:15px;font-weight:400;color:var(--muted);margin-left:7px}
  .save p{font-size:15.5px;color:var(--muted);margin-top:6px}
  .save button{margin-top:13px;width:100%;padding:16px;border-radius:12px;
        border:1px solid var(--deep);background:var(--deep);color:#fbf7ee;
        font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
  .save button[disabled]{opacity:.55;cursor:default}
  .save .done{margin-top:13px;padding:13px 14px;border-radius:12px;
        border:1px solid var(--ok);color:var(--ok);font-size:15.5px;font-weight:600}

  .foot{font-size:14.5px;color:var(--muted);text-align:center;margin-top:28px;line-height:1.6}
  .foot .build{display:block;margin-top:8px;font-size:12.5px;opacity:.7;
        letter-spacing:.04em}
  :focus-visible{outline:3px solid var(--deep);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="bar">
    <button id="back" aria-label="Go back">‹ Back</button>
    <div class="htitle">
      <div class="ja" id="hja">日本研修旅行</div>
      <div class="en" id="hen">Japan Study Tour 2026</div>
    </div>
  </div>
  <div class="navline"><nav>
    <button data-go="places" class="on"><span class="en">Places</span><span class="ja">ばしょ</span></button>
    <button data-go="phrases"><span class="en">Phrases</span><span class="ja">ことば</span></button>
    <button data-go="manners"><span class="en">Etiquette</span><span class="ja">マナー</span></button>
    <button data-go="home"><span class="en">Itinerary</span><span class="ja">りょてい</span></button>
  </nav></div>
</div>

<main>
  <div class="view" id="v-home"></div>
  <div class="view on" id="v-places"></div>
  <div class="view" id="v-phrases"></div>
  <div class="view" id="v-manners"></div>
  <div class="view" id="v-detail"></div>
</main>

<div id="show" role="dialog" aria-modal="true" aria-label="Show this to someone">
  <div class="body">
    <div class="hint">Hold this up</div>
    <div class="jp" id="showJp"></div>
    <div class="en" id="showEn"></div>
  </div>
  <button id="showClose">Close</button>
</div>

<button id="kanatab" aria-label="Open the kana charts"><span>か</span><span>な</span></button>

<div id="kana" role="dialog" aria-modal="true" aria-label="Kana charts">
  <div class="kbar">
    <button id="kanaClose" aria-label="Close">×</button>
    <button data-kana="hiragana" class="on">ひらがな</button>
    <button data-kana="katakana">カタカナ</button>
  </div>
  <div class="kwrap"><img id="kanaImg" alt="Kana chart"></div>
  <div class="kmore"><button id="kanaMore">＋ だくてん・ようおん<span class="en"></span></button></div>
</div>

<script src="map.js"></script>
<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }
  function head(ja, en){
    return '<h2>' + esc(ja) + '<span class="en">' + esc(en) + '</span></h2>';
  }
  function src(photo, small){
    var u = small ? photo.replace(/\.webp$/, "-t.webp") : photo;
    if (window.PHOTOS && window.PHOTOS[u]) return window.PHOTOS[u];
    return u;
  }
  // Two panels: where this place sits in Japan, and a closer view of the
  // stretch of coast the whole tour runs along. Both are drawn from real
  // coastline, inline, so they work with no connection.
  /* Where each label sits relative to its dot on the closer-up map. Worked
     out by eye so nothing collides: the six stops run diagonally and two of
     them, Hiroshima and Miyajima, are almost on top of each other. */
  var MAP_LABEL = {
    kyoto:     { dx:  0,   dy: -2.6, a: "middle", t: "Kyoto" },
    kobe:      { dx:  0.4, dy:  4.2, a: "middle", t: "Kobe" },
    himeji:    { dx:  0,   dy: -2.6, a: "middle", t: "Himeji" },
    soja:      { dx:  0,   dy: -2.6, a: "middle", t: "Soja" },
    hiroshima: { dx:  2.2, dy: -1.8, a: "start",  t: "Hiroshima" },
    miyajima:  { dx: -2.2, dy:  3.4, a: "end",    t: "Miyajima" }
  };
  /* Two towns nobody stays in but everybody passes through or lands at. */
  var MAP_CONTEXT = [
    { k: "Osaka",          dx: 0.6, dy: -2.4, a: "middle" },
    { k: "Kansai Airport", dx: 1.6, dy:  3.2, a: "middle" }
  ];

  function mapPanel(view, here){
    var m = window.MAP; if (!m) return "";
    var v = m[view], key = view === "japan" ? "j" : "r";
    var reg = view === "region";
    var svg = '<svg viewBox="0 0 ' + v.w + ' ' + v.h + '" aria-hidden="true">' +
              '<rect width="' + v.w + '" height="' + v.h + '" fill="#dde9f5"/>';
    v.d.forEach(function(d){
      svg += '<path d="' + d + '" fill="#eef1e4" stroke="#a9b3a5" stroke-width="0.35"/>';
    });
    function label(x, y, o, txt, size, fill, weight){
      // A pale halo under the text so a name stays readable over the coast.
      return '<text x="' + (x + o.dx) + '" y="' + (y + o.dy) + '" text-anchor="' +
             o.a + '" font-size="' + size + '" fill="#eef1e4" stroke="#eef1e4" ' +
             'stroke-width="1.5" stroke-linejoin="round">' + esc(txt) + '</text>' +
             '<text x="' + (x + o.dx) + '" y="' + (y + o.dy) + '" text-anchor="' +
             o.a + '" font-size="' + size + '" font-weight="' + weight + '" fill="' +
             fill + '">' + esc(txt) + '</text>';
    }
    // The rest of the tour, so a student can see where this stop sits in it.
    // Named on the closer-up map, where there is room for names.
    Object.keys(m.places).forEach(function(id){
      if (id === here) return;
      var q = m.places[id][key];
      svg += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + (reg ? 1.1 : 0.9) +
             '" fill="#8a8f88"/>';
      if (reg && MAP_LABEL[id]) svg += label(q[0], q[1], MAP_LABEL[id],
                                             MAP_LABEL[id].t, 3.1, "#4a5148", "600");
    });
    if (reg){
      MAP_CONTEXT.forEach(function(c){
        var a = m.anchors[c.k]; if (!a) return;
        svg += '<circle cx="' + a.r[0] + '" cy="' + a.r[1] + '" r="0.8" fill="#b3b8b1"/>' +
               label(a.r[0], a.r[1], c, c.k, 2.7, "#7a8078", "400");
      });
    }
    var pnt = m.places[here] && m.places[here][key];
    if (pnt){
      svg += '<circle cx="' + pnt[0] + '" cy="' + pnt[1] + '" r="3.2" fill="none" ' +
             'stroke="#a83232" stroke-width="0.8"/>' +
             '<circle cx="' + pnt[0] + '" cy="' + pnt[1] + '" r="1.7" fill="#a83232"/>';
      var o = reg ? MAP_LABEL[here] : null;
      if (o) svg += label(pnt[0], pnt[1], { dx:o.dx, dy:o.dy<0 ? o.dy-1.4 : o.dy+1.4, a:o.a },
                          o.t, 3.6, "#a83232", "700");
    }
    if (view === "japan"){
      // On the whole country the six stops are almost one dot, so only the
      // two ends of the map are named: it is orientation, not a road map.
      [["Tokyo", 2.5, 1.6, "start"], ["Fukuoka", 0, 5, "middle"]].forEach(function(a){
        var q = m.anchors[a[0]]; if (!q) return;
        svg += '<circle cx="' + q.j[0] + '" cy="' + q.j[1] + '" r="1" fill="#556"/>' +
               label(q.j[0], q.j[1], { dx:a[1], dy:a[2], a:a[3] }, a[0], 4, "#445", "400");
      });
    }
    return svg + '</svg>';
  }
  function maps(placeId){
    if (!window.MAP || !window.MAP.places[placeId]) return "";
    return '<div class="maps">' +
      '<div class="mp wide">' + mapPanel("region", placeId) +
        '<div class="cap">The tour, closer up</div></div>' +
      '<div class="mp">' + mapPanel("japan", placeId) +
        '<div class="cap">Where that is in Japan</div></div>' +
    '</div>';
  }

  // One tile, used for places, sights and spots. Colour comes from position
  // so a grid never repeats a shade side by side.
  function tile(item, attr, meta, i){
    var body;
    if (item.photo){
      body = '<div class="ph' + (item.fit === "contain" ? " contain" : "") + '">' +
             '<img src="' + esc(src(item.photo, true)) + '" alt="" loading="lazy"></div>';
    } else {
      var g = String(item.ja || "");
      var k = g.length <= 2 ? "" : (g.length === 3 ? " s3" : (g.length === 4 ? " s4" : " s5"));
      body = '<div class="big"><span class="' + k.trim() + '">' + esc(g) + '</span></div>';
    }
    var bg = item.tone === "quiet" ? "#e4e5e3" : "var(--c" + ((i % 8) + 1) + ")";
    return '<button class="gt" style="background:' + bg + '" ' + attr + '>' +
             body +
             '<div class="lab">' +
             (item.photo ? '<div class="ja">' + esc(item.ja) + '</div>' : '') +
             '<div class="en' + (item.photo ? '' : ' solo') + '">' + esc(item.en) + '</div>' +
             (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') +
           '</div></button>';
  }

  function todayIndex(){
    var n = new Date();
    var t = n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,"0") +
            "-" + String(n.getDate()).padStart(2,"0");
    for (var i=0;i<TRIP.days.length;i++){ if (TRIP.days[i].date === t) return i; }
    return -1;
  }
  function daysUntil(){
    var n = new Date(); n.setHours(0,0,0,0);
    return Math.round((new Date(TRIP.start + "T00:00:00") - n) / 86400000);
  }

  /* ================= HOME ================= */
  function renderHome(){
    var i = todayIndex(), h = "";
    if (i > -1){
      var d = TRIP.days[i];
      h += '<div class="today"><div class="lbl">Today  きょう</div>' +
           '<div class="d">' + esc(d.ja) + '<span class="en">Day ' + d.n + ' of 12: ' +
           esc(d.en) + '</span></div><div class="nt">' + esc(d.note) + '</div></div>';
    } else {
      var n = daysUntil();
      var line = n > 0 ? (n === 1 ? "Tomorrow." : n + " days to go.")
                       : "The tour is over. Welcome home.";
      h += '<div class="today"><div class="lbl">Departure  しゅっぱつ</div>' +
           '<div class="d">' + esc(line) +
           '<span class="en">Melbourne, 20 September 2026, 18:25</span></div>' +
           '<div class="nt">Open this on the day and it shows where we are up to.</div></div>';
    }
    /* The tab is called Itinerary now, so the page does not repeat itself. */
    h += '<div>';
    TRIP.days.forEach(function(d, k){
      h += '<div class="day' + (k === i ? " now" : "") + '"><div class="n">' + d.n + '</div>' +
           '<div><div class="t">' + esc(d.ja) + '<span class="en">' + esc(d.en) + '</span></div>' +
           '<div class="nt">' + esc(d.note) + '</div></div></div>';
    });
    h += '</div>';
    h += '<p class="foot">Meeting points, phone numbers and your emergency details ' +
         'are on your lanyard, not in this app.' +
         // A visible version, so "which one am I looking at" is answerable
         // without guessing. Keep BUILD in step with CACHE in sw.js.
         '<span class="build">' + esc(BUILD) + '</span></p>';
    $("v-home").innerHTML = h;
  }

  /* ================= PLACES: three short levels ================= */
  function renderPlaces(){
    var h = head("ばしょ", "Places we are going") +
            '<p class="lede">Tap a place, then the thing you are standing in front of.</p>' +
            '<div class="grid">';
    PLACES.forEach(function(p, i){
      var n = p.sights.reduce(function(a,s){ return a + s.spots.length; }, 0);
      h += tile(p, 'data-place="' + esc(p.id) + '"', p.days + " · " + n + " to find", i);
    });
    h += '</div>';
    h += '<div class="save" id="save"><h3>Save for offline<span class="en">オフライン</span></h3>' +
         '<p>Press this on hotel or home wifi before you go out for the day. It ' +
         'stores every page and photo on your phone, so the app still works with ' +
         'no signal and no data.</p>' +
         '<button id="saveBtn">Save it all  ぜんぶ保存</button></div>';
    $("v-places").innerHTML = h;
  }

  // level 2: the sights in a place, as short rows rather than one long page
  function placeHtml(p){
    var q = p.tone === "quiet";
    var h = '<div' + (q ? ' class="quiet"' : '') + '>' + head(p.ja, p.en) +
            '<p class="lede">' + esc(p.intro) + '</p>' +
            (p.note ? '<div class="tone-note">' + esc(p.note) + '</div>' : '') +
            maps(p.id) +
            '<div class="grid" style="margin-top:16px">';
    p.sights.forEach(function(s2, i){
      h += tile(s2, 'data-sight="' + esc(p.id + "/" + s2.id) + '"',
                s2.spots.length + " to look at", i);
    });
    return h + '</div></div>';
  }

  // level 3: the tiles for one sight
  function sightHtml(p, s){
    var q = p.tone === "quiet";
    var h = '<div' + (q ? ' class="quiet"' : '') + '>' + head(s.ja, s.en) +
            '<p class="lede">' + esc(s.intro) + '</p>' +
            (s.credit ? '<p class="credit">' + esc(s.credit) + '</p>' : '') +
            '<div class="grid">';
    s.spots.forEach(function(sp, i){
      h += tile(sp, 'data-spot="' + esc(p.id + "/" + s.id + "/" + sp.id) + '"', "", i);
    });
    return h + '</div></div>';
  }

  function spotHtml(p, s, sp){
    var q = p.tone === "quiet";
    var lbl = q ? "Something to think about  かんがえてみよう"
                : "Go and do this  やってみよう";
    return '<div' + (q ? ' class="quiet"' : '') + '>' + head(sp.ja, sp.en) +
           '<p class="where">' + esc(s.ja) + '  ' + esc(s.en) + '</p>' +
           (sp.photo ? '<div class="bigshot' + (sp.fit === "contain" ? " contain" : "") +
              '"><img src="' + esc(src(sp.photo, false)) + '" alt=""></div>' : '') +
           (sp.credit ? '<p class="credit">' + esc(sp.credit) + '</p>' : '') +
           '<p class="hook">' + esc(sp.hook) + '</p>' +
           '<div class="look"><div class="lbl">' + esc(lbl) + '</div>' +
           '<p>' + esc(sp.look) + '</p></div></div>';
  }

  function find(path){
    var b = path.split("/");
    var p = PLACES.filter(function(x){ return x.id === b[0]; })[0]; if (!p) return null;
    var s = b[1] ? p.sights.filter(function(x){ return x.id === b[1]; })[0] : null;
    var sp = (s && b[2]) ? s.spots.filter(function(x){ return x.id === b[2]; })[0] : null;
    return { p: p, s: s, sp: sp };
  }

  /* ================= PHRASES ================= */
  var phraseIndex = [];
  function renderPhrases(){
    phraseIndex = [];
    PHRASES.forEach(function(g){ g.items.forEach(function(it){ phraseIndex.push(it); }); });
    var h = head("ことば", "Phrases") +
            '<p class="lede">Pick the situation you are in. Everything is in kana. ' +
            'The \u304b\u306a tab down the side opens the charts if a character has ' +
            'gone out of your head.</p><div class="grid">';
    PHRASES.forEach(function(g, i){
      h += tile(g, 'data-group="' + esc(g.id) + '"', g.items.length + " phrases", i);
    });
    $("v-phrases").innerHTML = h + '</div>';
  }
  function groupHtml(g){
    var base = 0;
    for (var i=0;i<PHRASES.length;i++){
      if (PHRASES[i].id === g.id) break;
      base += PHRASES[i].items.length;
    }
    var h = head(g.ja, g.en) + '<p class="lede">' + esc(g.note) + '</p><div class="stack">';
    g.items.forEach(function(it, k){
      h += '<button class="phrase" data-ph="' + (base + k) + '">' +
             '<div class="jp">' + esc(it.ja) + '</div>' +
             '<div class="en">' + esc(it.en) + '</div>' +
             (it.tip ? '<div class="tip">' + esc(it.tip) + '</div>' : "") +
             (it.show ? '<div class="showtag">tap to show someone</div>' : "") +
           '</button>';
    });
    return h + '</div>';
  }

  /* ---- kana charts ----------------------------------------------------
     One image per script, drawn as an SVG so it stays sharp at any size and
     is precached with the rest of the app. The charts are the standard
     五十音表: columns read right to left from あ and finish at ん. The tab
     opens on the 46 alone so it is a quick check at a glance; the voiced
     set and the yoon are one tap further in rather than something to
     scroll past. All four images are precached. */
  var kanaScript = "hiragana", kanaExtra = false;
  function drawKana(){
    [].forEach.call(document.querySelectorAll("[data-kana]"), function(b){
      b.className = b.dataset.kana === kanaScript ? "on" : "";
    });
    var img = $("kanaImg"), name = kanaScript + (kanaExtra ? "-plus" : "");
    img.src = "kana-" + name + ".svg";
    img.alt = (kanaScript === "katakana" ? "Katakana" : "Hiragana") +
              (kanaExtra ? " voiced and small kana chart" : " chart");
    var b = $("kanaMore");
    b.className = kanaExtra ? "on" : "";
    b.firstChild.nodeValue = kanaExtra ? "\u2190 \u3054\u3058\u3085\u3046\u304a\u3093"
                                       : "\uff0b \u3060\u304f\u3066\u3093\u30fb\u3088\u3046\u304a\u3093";
    b.querySelector(".en").textContent = kanaExtra ? "Back to the 46"
                                                   : "Voiced and small kana";
  }
  /* ---- swipe between sections ------------------------------------------
     Andrew: the tabs should not be something you scroll back up to reach.
     They are pinned to the top anyway, but on a phone a sideways swipe is
     the quicker move, so the whole page takes one. Inside a place, a swipe
     right goes back a level, which is what a thumb expects. A swipe only
     counts if it is clearly sideways, so it never fights normal scrolling. */
  var TAB_ORDER = ["places", "phrases", "manners", "home"];
  var tsX = 0, tsY = 0, tsT = 0, tracking = false;
  document.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) { tracking = false; return; }
    if ($("kana").className === "on" || $("show").className === "on"){
      tracking = false; return;
    }
    tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
    tsT = Date.now(); tracking = true;
  }, { passive: true });
  document.addEventListener("touchend", function(e){
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - tsX, dy = t.clientY - tsY;
    if (Date.now() - tsT > 700) return;            // a drag, not a flick
    if (Math.abs(dx) < 65 || Math.abs(dx) < Math.abs(dy) * 2) return;
    if (stack.length){ if (dx > 0) back(); return; }
    var cur = document.querySelector("nav button.on");
    var i = TAB_ORDER.indexOf(cur ? cur.dataset.go : "places");
    var n = i + (dx < 0 ? 1 : -1);
    if (n < 0 || n >= TAB_ORDER.length) return;    // no wrapping round
    goTab(TAB_ORDER[n]);
  }, { passive: true });

  function openKana(){
    kanaExtra = false;
    drawKana();
    $("kana").className = "on";
  }
  function closeKana(){ $("kana").className = ""; }

  /* ================= MANNERS ================= */
  function renderManners(){
    var h = head("マナー", "Etiquette") +
            '<p class="lede">How these things are usually done in Japan. Not a full ' +
            'list, just the ones that come up in the first couple of days. Tap one ' +
            'to read it.</p><div class="grid">';
    MANNERS.forEach(function(m, i){
      h += tile(m, 'data-manner="' + i + '"', "", i);
    });
    $("v-manners").innerHTML = h + '</div><div id="mdrop"></div>';
  }
  // Short enough to read in place, so a manner drops open under the grid
  // rather than sending anyone to another page.
  function openManner(i){
    var m = MANNERS[i]; if (!m) return;
    [].forEach.call(document.querySelectorAll("[data-manner]"), function(b){
      b.classList.toggle("sel", b.dataset.manner === String(i));
    });
    var d = $("mdrop");
    d.innerHTML = '<div class="drop"><div class="h">' + esc(m.ja) +
                  '<span class="en">' + esc(m.en) + '</span></div><p>' + esc(m.body) + '</p></div>';
    d.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  /* ================= navigation ================= */
  var BUILD = "Version 21, 10 September 2026";
  var TABS = { home:["りょてい","Itinerary"], places:["ばしょ","Places"],
               phrases:["ことば","Phrases"], manners:["マナー","Etiquette"] };
  var stack = [];
  function setQuiet(on){ document.body.classList[on ? "add":"remove"]("quiet"); }
  function setHeader(ja, en, canBack){
    $("hja").textContent = ja; $("hen").textContent = en;
    $("back").className = canBack ? "on" : "";
  }
  function showView(id){
    ["home","places","phrases","manners","detail"].forEach(function(v){
      $("v-"+v).className = "view" + (v === id ? " on" : "");
    });
    window.scrollTo(0,0);
  }
  function goTab(name){
    stack = []; setQuiet(false); showView(name);
    setHeader(TABS[name][0], TABS[name][1], false);
    [].forEach.call(document.querySelectorAll("nav button"), function(b){
      b.className = b.dataset.go === name ? "on" : "";
    });
  }
  function push(draw, ja, en){
    stack.push({ draw: draw, ja: ja, en: en });
    draw(); showView("detail"); setHeader(ja, en, true);
  }
  function back(){
    stack.pop();
    if (stack.length){
      var s = stack[stack.length-1];
      s.draw(); showView("detail"); setHeader(s.ja, s.en, true);
    } else {
      var cur = document.querySelector("nav button.on");
      goTab(cur ? cur.dataset.go : "places");
    }
  }

  document.addEventListener("click", function(e){
    var t;
    if ((t = e.target.closest("nav button"))) return goTab(t.dataset.go);
    if (e.target.closest("#back")) return back();
    if ((t = e.target.closest("[data-place]"))){
      var r = find(t.dataset.place); if (!r) return;
      return push(function(){ setQuiet(r.p.tone === "quiet");
        $("v-detail").innerHTML = placeHtml(r.p); }, r.p.ja, r.p.en);
    }
    if ((t = e.target.closest("[data-sight]"))){
      var r2 = find(t.dataset.sight); if (!r2 || !r2.s) return;
      return push(function(){ setQuiet(r2.p.tone === "quiet");
        $("v-detail").innerHTML = sightHtml(r2.p, r2.s); }, r2.s.ja, r2.s.en);
    }
    if ((t = e.target.closest("[data-spot]"))){
      var r3 = find(t.dataset.spot); if (!r3 || !r3.sp) return;
      return push(function(){ setQuiet(r3.p.tone === "quiet");
        $("v-detail").innerHTML = spotHtml(r3.p, r3.s, r3.sp); }, r3.sp.ja, r3.sp.en);
    }
    if ((t = e.target.closest("[data-group]"))){
      var g = PHRASES.filter(function(x){ return x.id === t.dataset.group; })[0];
      if (!g) return;
      return push(function(){ $("v-detail").innerHTML = groupHtml(g); }, g.ja, g.en);
    }
    if ((t = e.target.closest("[data-manner]"))) return openManner(+t.dataset.manner);
    if ((t = e.target.closest("[data-ph]"))) return openShow(phraseIndex[+t.dataset.ph]);
    if (e.target.closest("#showClose")) return closeShow();
    if (e.target.closest("#kanatab")) return openKana();
    if (e.target.closest("#kanaClose")) return closeKana();
    if (e.target.closest("#kanaMore")){ kanaExtra = !kanaExtra; return drawKana(); }
    if ((t = e.target.closest("[data-kana]"))){ kanaScript = t.dataset.kana; return drawKana(); }
  });

  function openShow(it){
    if (!it) return;
    $("showJp").textContent = it.ja; $("showEn").textContent = it.en;
    $("show").className = "on";
  }
  function closeShow(){ $("show").className = ""; }
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if ($("kana").className === "on") closeKana();
    else if ($("show").className === "on") closeShow();
    else if (stack.length) back();
  });

  /* ================= offline ================= */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
  var SAVED_KEY = "jtSaved-v14";
  function allPhotos(){
    var out = [];
    PLACES.forEach(function(p){ p.sights.forEach(function(s){
      [s].concat(s.spots).forEach(function(x){
        if (x.photo){ out.push(x.photo); out.push(x.photo.replace(/\.webp$/, "-t.webp")); }
      });
    }); });
    return out.filter(function(v,i,a){ return a.indexOf(v) === i; });
  }
  function markSaved(msg){
    var box = $("save"); if (!box) return;
    var b = $("saveBtn"); if (b) b.remove();
    var d = box.querySelector(".done");
    if (!d){ d = document.createElement("div"); d.className = "done"; box.appendChild(d); }
    d.textContent = msg;
  }
  document.addEventListener("click", function(e){
    if (!e.target.closest("#saveBtn")) return;
    var btn = $("saveBtn");
    if (location.protocol.indexOf("http") !== 0){
      btn.disabled = true; btn.textContent = "Open this from its web address first"; return;
    }
    var list = allPhotos(), done = 0, failed = 0;
    btn.disabled = true; btn.textContent = "Saving 0 of " + list.length;
    Promise.all(list.map(function(u){
      return fetch(u, { cache: "reload" })
        .then(function(r){ if (!r.ok) failed++; }, function(){ failed++; })
        .then(function(){ done++; btn.textContent = "Saving " + done + " of " + list.length; });
    })).then(function(){
      if (failed){
        /* honest: a photo that did not arrive is not saved. Leave the button. */
        btn.disabled = false;
        btn.textContent = "Saved " + (list.length - failed) + " of " + list.length +
          " photos. Try again on wifi.";
        return;
      }
      try { localStorage.setItem(SAVED_KEY, String(Date.now())); } catch(err){}
      markSaved("Saved. This app now works with no signal.");
    });
  });

  renderHome(); renderPlaces(); renderPhrases(); renderManners();
  /* The key carries the app version, so after an update the button comes
     back and the new photos get saved too. Keep in step with CACHE in sw.js. */
  try { if (localStorage.getItem(SAVED_KEY)) markSaved("Saved. This app works with no signal."); }
  catch(err){}
  goTab("places");
})();
</script>
</body>
</html>
