      + '<div class="row"><button class="btn" data-r="me">Mark yourself</button>'
      + '<button class="btn ghost" data-r="mock">Run it again</button></div>'
      + foot();
    wireScript();
    each($("main"), "[data-r]", function(b){
      b.onclick = function(){ MOCK = null; go(b.dataset.r); };
    });
  }

  /* ---- Section 2, steered by the student ----
     An app with no AI cannot work out what an assessor would ask next. So
     it does not pretend to: the student picks the direction, from the eight
     an assessor actually goes in, while the clock runs. That is closer to
     the room than a fixed list, and steering the questioning towards your
     own research is something the flow sheet teaches outright. */
  function pickMove(mv){
    var t = topicById(MOCK.topic);
    if (!t) return null;
    var pool = t.questions.filter(function(q){
      return q.move === mv && !MOCK.asked[q.id];
    });
    if (!pool.length){
      pool = t.questions.filter(function(q){ return q.move === mv; });
      if (!pool.length) return null;
    }
    var q = pool[Math.floor(Math.random() * pool.length)];
    MOCK.asked[q.id] = 1;
    return topicQ(t, q, "s2");
  }
  function drawDisc2(){
    var t = topicById(MOCK.topic);
    var q = MOCK.q2;
    setHead([{ ja:"タイムれんしゅう", r:"mock" },
             { ja:t ? t.name_ja : "ディスカッション", r:"mock:run" }],
            "Section 2 · " + (t ? t.name_en : "Discussion"));
    var left = {};
    FL.section2.moves.forEach(function(mv){
      left[mv.id] = t ? t.questions.filter(function(x){
        return x.move === mv.id && !MOCK.asked[x.id];
      }).length : 0;
    });
    var h = '<div class="clock" id="clock"><b id="cnum">--:--</b>'
          + '<span>left in Section 2 · ' + esc(t ? t.name_en : "Discussion")
          + '</span></div>';
    if (q){
      var mvDef = FL.section2.moves.filter(function(m){
        return m.id === MOCK.lastMove; })[0];
      h += '<div class="step">' + esc(mvDef ? mvDef.label_en : "Opening question")
         + '</div>'
         + '<div class="qrow"><div class="card">' + jaLine(q.question_ja)
         + enLine(q.question_en) + '</div>'
         + '<button class="playbtn" id="playq2" aria-label="Hear it"></button></div>'
         + '<p class="note">No model answer: this one is yours. If it is not a '
         + 'question you prepared, steer them back rather than going quiet.</p>';
    }
    h += recordBlock("disc2");
    h += '<h3>What do they ask next?</h3>'
       + '<p class="lede">You decide, because no app without AI can. Picking '
       + 'the direction is the same skill as steering a real assessor towards '
       + 'what you researched.</p>'
       + '<div class="moves">'
       + FL.section2.moves.map(function(mv){
           return '<button class="movebtn" data-m="' + esc(mv.id) + '"'
                + (left[mv.id] ? "" : " disabled")
                + '><b>' + esc(mv.label_en) + '</b>'
                + '<i>' + ruby(mv.label_ja) + '</i>'
                + '<span>' + esc(mv.about) + '</span></button>';
         }).join("")
       + '</div>'
       + '<details><summary>If it is going the wrong way</summary>'
       + '<div class="dbody">'
       + FL.section2.strategies.map(function(x){
           return '<div class="card flat">' + jaLine(x.ja) + enLine(x.en)
                + (x.note ? '<p class="note" style="margin:6px 0 0">'
                          + esc(x.note) + '</p>' : "") + '</div>';
         }).join("") + '</div></details>'
       + '<div class="row"><button class="btn ghost" id="endS2">Finish</button>'
       + '</div>';
    $("main").innerHTML = h + foot();

    if ($("playq2") && q) $("playq2").onclick = function(){ SAY.speak(q.question_ja); };
    if (q && !MOCK.heard){ MOCK.heard = 1; SAY.speak(q.question_ja); }
    each($("main"), "[data-m]", function(b){
      b.onclick = function(){
        SAY.stop();
        var got = pickMove(b.dataset.m);
        if (!got) return;
        MOCK.q2 = got; MOCK.lastMove = b.dataset.m; MOCK.heard = 0;
        draw();
      };
    });
    $("endS2").onclick = function(){ stopClock(); MOCK.part = "exit"; draw(); };
    wireRecorder($("main"));

    paintClock();
    stopClock();
    clockTimer = setInterval(function(){
      MOCK.left--;
      paintClock();
      if (MOCK.left <= 0){ stopClock(); MOCK.part = "exit"; draw(); }
    }, 1000);
  }

  function drawMockRun(){
    var sec = runSec();
    var list = MOCK.sec === 0 ? MOCK.s1 : MOCK.s2;
    var q = list[MOCK.at];
    setHead([{ ja:"タイムれんしゅう", r:"mock" }, { ja:sec.name_ja, r:"mock:run" }],
            (sec.number ? "Section " + sec.number + " · " : "")
            + sec.name_en
            + " · question " + (MOCK.at + 1) + " of " + list.length);
    var m = $("main");
    var grp = MOCK.sec === 0 ? TOPNAME[q.topic] : STAGENAME[q.topic];

    var bandName = (BANDS.filter(function(b){ return b.id === MOCK.band; })[0]
                    || BANDS[0]).lab;
    /* Section 2 on the student's own topic says so, because that is the
       thing they are being examined on and the strip is the only place it
       appears while the clock is running. The band governs Section 1, so a
       SAC run, which the band does not govern, leaves it off. */
    var myT = MOCK.topic ? topicById(MOCK.topic) : null;
    var h = '<div class="clock" id="clock"><b id="cnum">--:--</b>'
          + '<span>left in '
          + (sec.number
             ? "Section " + sec.number + " · " + esc(sec.name_en)
               + (sec.number === 2 && myT ? " · " + esc(myT.name_en) : "")
             : myT ? "four minutes · " + esc(sec.name_en)
             : "your four minutes")
          + (MOCK.kind === "sac" ? "" : ' · ' + esc(bandName))
          + '</span></div>';

    var step = MOCK.kind === "sac" && MOCK.topic
             ? sec.name_en + " · " + q.question_type
             : (grp ? grp.en : q.topic) + (q.higher_order ? " · higher order" : "");
    h += '<div class="step">' + esc(step) + '</div>';

    if (!MOCK.shown){
      h += '<div class="hidden-q" id="hq">The assessor has asked you something.'
         + '<div class="row" style="justify-content:center">'
         + '<button class="btn" id="again">Hear it again</button>'
         + '<button class="btn ghost" id="show">Show the question</button></div>'
         + '</div>';
    } else {
      h += '<div class="card">' + jaLine(q.question_ja) + enLine(q.question_en)
         + '</div>';
      if (MOCK.fu >= 0){
        h += '<div class="step">Follow-up ' + (MOCK.fu + 1) + ' of '
           + followupsFor(q).length + '</div><div class="card">'
           + jaLine(q.followups[MOCK.fu].ja)
           + enLine(q.followups[MOCK.fu].en) + '</div>';
      }
      /* A topic question carries no model answer, because the student
         researched the topic and this app did not. Inventing one would be
         putting words in their mouth. */
      if (q.model_responses)
        h += '<details><summary>A developed answer, if you are stuck</summary>'
           + '<div class="dbody">' + jaLine(q.model_responses.developed.ja)
           + enLine(q.model_responses.developed.en) + '</div></details>';
      else
        h += '<p class="note">No model answer here: this one is yours. If the '
           + 'question is not one you prepared, say so in Japanese and keep '
           + 'going.</p>';
    }

    h += recordBlock("mock");

    h += '<div class="row">';
    if (MOCK.shown){
      if (MOCK.fu < followupsFor(q).length - 1)
        h += '<button class="btn" id="nextfu">Next follow-up</button>';
      h += '<button class="btn ghost" id="nextq">'
         + (MOCK.at < list.length - 1 ? "Next question"
            : (MOCK.kind === "sac" || MOCK.sec === 1 ? "Finish"
               : "On to Section 2")) + '</button>';
    }
    h += '<button class="btn ghost" id="quit">Stop</button></div>';
    m.innerHTML = h + foot();

    paintClock();
    stopClock();
    clockTimer = setInterval(function(){
      MOCK.left--;
      paintClock();
      if (MOCK.left <= 0){ stopClock(); nextSection(); }
    }, 1000);

    /* The question is spoken as soon as it arrives, the way it happens in the
       room. A phone that has not been touched yet will refuse, which is why
       Hear it again is there. */
    if (!MOCK.shown) SAY.speak(q.question_ja);
    if ($("again")) $("again").onclick = function(){ SAY.speak(q.question_ja); };
    if ($("show")) $("show").onclick = function(){ MOCK.shown = true; drawMockRun(); };
    if ($("nextfu")) $("nextfu").onclick = function(){
      MOCK.fu++; drawMockRun();
      SAY.speak(q.followups[MOCK.fu].ja);
    };
    if ($("nextq")) $("nextq").onclick = function(){
      if (MOCK.at < list.length - 1){
        MOCK.at++; MOCK.shown = false; MOCK.fu = -1; drawMockRun();
      } else nextSection();
    };
    $("quit").onclick = function(){ stopClock(); MOCK = null; go("mock"); };
    wireRecorder(m);
  }
  function nextSection(){
    if (MOCK.kind === "sac"){ stopClock(); return drawMockDone(); }
    stopClock();
    MOCK.part = "trans";
    draw();
  }
  function paintClock(){
    var el = $("cnum"); if (!el) return;
    var s = Math.max(0, MOCK.left);
    el.textContent = Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
    $("clock").classList.toggle("low", s <= 60);
  }
  function drawMockDone(){
    var sac = MOCK && MOCK.kind === "sac";
    setHead([{ ja:"タイムれんしゅう", r:"mock" }, { ja:"おわり", r:"mock:run" }],
            sac ? "Four minutes done" : "Fifteen minutes done");
    $("main").innerHTML = '<h2>おわりました<span class="en">'
      + (sac ? 'That is the four minutes'
             : 'That is the whole examination') + '</span></h2>'
      + '<p>Now mark yourself against the four criteria while it is fresh. The '
      + 'descriptors are the official ones, word for word.</p>'
      + '<div class="row"><button class="btn" data-r="me">Mark yourself</button>'
      + '<button class="btn ghost" data-r="mock">Run it again</button></div>' + foot();
    each($("main"), "[data-r]", function(b){
      b.onclick = function(){ MOCK = null; go(b.dataset.r); };
    });
  }

  /* Particles, by recognition. The Grammar Hub drills them by typing one
     in; this drills spotting the wrong one, which is the half you have to
     do to your own sentence while you are still speaking it. */
  function drawParticles(){
    setHead([{ ja:"ドリル", r:"drill" }, { ja:"じょし", r:"drill:pt" }], "Particles");
    var h = '<h2>じょし<span class="en">Particles</span></h2>'
          + '<p class="lede">Reading a wrong particle in somebody else\u2019s '
          + 'sentence is how you start catching it in your own. The explanation '
          + 'comes up whichever way you answer.</p>'
          + '<div class="tiles">'
          + PT.rounds.map(function(r){
              return '<button class="tile" data-r="drill:r:' + esc(r.id) + '">'
                   + '<b>' + esc(r.title) + '</b>'
                   + '<i>' + r.items.length + ' items</i>'
                   + '<i class="what">' + esc(r.about) + '</i></button>';
            }).join("")
          + '</div>'
          + '<h3>Writing them, not just spotting them</h3>'
          + '<p class="lede">The Grammar Hub has the other half of this: the same '
          + 'particles, typed into the gap rather than chosen from four. Worth a '
          + 'turn once these feel easy.</p>'
          + '<a class="tile" style="display:block;text-decoration:none" '
          + 'href="https://liaminhawai-cmd.github.io/japanese-hub/grammar/" '
          + 'target="_blank" rel="noopener"><b>Grammar Hub \u203a Particles</b>'
          + '<i>Opens in a new tab, needs a connection</i></a>' + foot();
    $("main").innerHTML = h;
    each($("main"), "[data-r]", function(b){
      b.onclick = function(){ go(b.dataset.r); };
    });
  }

  /* ================= 3. the drills ================= */
  var DSTATE = {};

  RENDER.drill = function(args){
    if (args[0] === "weak") return drawWeak();
    if (args[0] === "pt") return drawParticles();
    if (args[0] === "qw") return drawQwords();
    if (args[0] === "r") return drawRound(args[1]);
    if (args[0]) return drawDrill(args[0]);
    setHead([{ ja:"ドリル", r:"drill" }], "Drills · built from what the VCAA oral exam reports mark down");
    var weak = weakList();
    var h = '<h2>ドリル<span class="en">Short rounds, every item from a fault '
          + 'the VCAA oral exam reports named</span></h2>'
          + '<div class="tiles">'
          + ER.drills.map(function(d){
              return '<button class="tile" data-d="' + esc(d.id) + '">'
                   + '<b>' + esc(d.title) + '</b><i>' + d.items.length
                   + ' items</i></button>';
            }).join("")
          + '<button class="tile" data-d="weak"><b>Weak-spot review</b><i>'
          + (weak.length ? weak.length + " to come back to" : "nothing yet")
          + '</i></button>'
          + '<button class="tile" data-d="qw"><b>Question words</b><i>'
          + QW.rounds.reduce(function(n, r){ return n + r.items.length; }, 0)
          + ' items</i><i class="what">Catch what is being asked, and answer '
          + 'that</i></button>'
          + '<button class="tile" data-d="pt"><b>Particles</b><i>'
          + PT.rounds.reduce(function(n, r){ return n + r.items.length; }, 0)
          + ' items</i><i class="what">Spot the wrong one, in somebody '
          + 'else\u2019s sentence first</i></button>'
          + '</div>'
          + '<h3>The nineteen faults</h3>'
          + '<p class="lede">Every one of these is named in at least one of the '
          + 'VCAA oral exam reports from 2020 to 2025, commonest first.</p>'
          + ER.errors.slice().sort(function(a,b){ return b.count - a.count; })
              .map(function(e){
                return '<details><summary>' + esc(e.name)
                     + ' <span class="tier">' + e.count
                     + ' of the 6 VCAA reports</span>'
                     + '</summary><div class="dbody">'
                     + '<div class="en" style="margin-bottom:7px">'
                     + esc(e.what_goes_wrong) + '</div>'
                     + fixPair(e.wrong, e.right)
                     + '<p class="en" style="margin-top:7px">' + esc(e.why) + '</p>'
                     + e.report_quotes.map(function(r){
                         return '<div class="tip"><q>' + esc(r) + '</q></div>';
                       }).join("")
                     + '</div></details>';
              }).join("");
    $("main").innerHTML = h + foot();
    each($("main"), "[data-d]", function(b){
      b.onclick = function(){ go("drill:" + b.dataset.d); };
    });
  };

  function weakList(){
    var out = [];
    Object.keys(S.weak).forEach(function(k){
      if (S.weak[k] && S.weak[k].miss > (S.weak[k].hit || 0)) out.push(k);
    });
    return out;
  }
  function markWeak(eid, hit){
    if (!eid) return;
    var w = S.weak[eid] = S.weak[eid] || { hit:0, miss:0 };
    if (hit) w.hit++; else w.miss++;
    save();
  }

  function drawDrill(id, only){
    var d = null;
    ER.drills.forEach(function(x){ if (x.id === id) d = x; });
    if (!d) return go("drill", true);
    var items = d.items;
    if (only && only.length)
      items = items.filter(function(it){ return only.indexOf(it.error_id) >= 0; });
    if (!items.length) items = d.items;
    var st = DSTATE[id] = DSTATE[id] || { at:0, open:false, hit:0, miss:0 };
    if (st.at >= items.length) st.at = 0;
    var it = items[st.at];

    setHead([{ ja:"ドリル", r:"drill" }, { ja:d.title, r:"drill:" + id }],
            d.title + " · " + (st.at + 1) + " of " + items.length);
    var m = $("main");
    var h = '<p class="lede">' + esc(d.how) + '</p>'
          + '<div class="step">' + (st.at + 1) + ' of ' + items.length
          + ' · <span class="score">' + st.hit + ' right, ' + st.miss
          + ' to come back to</span></div>';

    if (d.type === "spot"){
      h += '<div class="card"><div class="ja" data-say="' + esc(speakable(it.wrong))
         + '">' + ruby(it.wrong) + '</div></div>'
         + '<p class="lede">What is wrong with it? Say the corrected sentence out '
         + 'loud, then check.</p>'
         + '<div class="reveal' + (st.open ? " on" : "") + '" id="rv">'
         + '<div class="card"><div class="tier">The fault</div><b>'
         + esc((ERBYID[it.error_id] || {}).name || "") + '</b>'
         + '<div class="en" style="margin:5px 0 8px">' + esc(it.fix_en) + '</div>'
         + fixPair(it.wrong, it.right) + '</div></div>';
    } else if (d.type === "extend"){
      h += '<div class="card">' + jaLine(it.question) + enLine(it.question_en)
         + '</div>'
         + '<div class="card" style="border-color:var(--accent)">'
         + '<div class="tier">A one-sentence answer</div>'
         + jaLine(it.thin) + enLine(it.thin_en) + '</div>'
         + '<p class="lede">Add two or three more things: a detail, a reason, an '
         + 'example, an opinion. Say the long version out loud, then check.</p>'
         + '<div class="reveal' + (st.open ? " on" : "") + '" id="rv">'
         + '<div class="card" style="border-color:var(--ok)">'
         + '<div class="tier">What it should sound like · added: '
         + esc((it.added || []).join(", ")) + '</div>'
         + jaLine(it.better) + enLine(it.better_en) + '</div></div>';
    } else if (d.type === "upgrade"){
      h += '<div class="card">' + jaLine(it.question) + enLine(it.question_en)
         + '</div>'
         + '<div class="card" style="border-color:var(--accent)">'
         + '<div class="tier">The closed answer that stops the conversation</div>'
         + jaLine(it.closed) + enLine(it.closed_en) + '</div>'
         + '<p class="lede">Answer it, then keep going without being asked again.</p>'
         + '<div class="reveal' + (st.open ? " on" : "") + '" id="rv">'
         + '<div class="card" style="border-color:var(--ok)">'
         + '<div class="tier">Open</div>'
         + jaLine(it.open) + enLine(it.open_en) + '</div></div>';
    } else if (d.type === "repair"){
      h += '<div class="card"><b>' + esc(it.situation_en) + '</b></div>'
         + '<p class="lede">Say it in Japanese before you look.</p>'
         + '<div class="reveal' + (st.open ? " on" : "") + '" id="rv">'
         + '<div class="card">' + jaLine(it.say) + enLine(it.say_en) + '</div></div>';
    } else if (d.type === "shadow"){
      h += '<div class="card">' + jaLine(it.ja) + enLine(it.en) + '</div>'
         + '<div class="tip"><b>Listen for</b>' + esc(it.watch_en) + '</div>'
         + '<p class="lede">Play it, then say it over the top of it. 0.7× first, '
         + 'then ×1. Match the length of every sound, not just the word.</p>'
         + '<div class="row"><button class="btn" id="play07">Play at 0.7×</button>'
         + '<button class="btn ghost" id="play10">Play at ×1</button></div>';
      st.open = true;
    }

    h += recordBlock("drill-" + id);
    h += '<div class="row">';
    if (!st.open) h += '<button class="btn" id="check">Check</button>';
    else h += '<button class="btn ghost" id="got">I had it right</button>'
            + '<button class="btn warn" id="not">Come back to this</button>';
    h += '</div>'
       + '<div class="row"><button class="btn ghost" id="skip">Skip ›</button></div>'
       + foot();
    m.innerHTML = h;

    if ($("check")) $("check").onclick = function(){
      st.open = true; drawDrill(id, only);
    };
    if ($("got")) $("got").onclick = function(){
      st.hit++; markWeak(it.error_id, true); advance();
    };
    if ($("not")) $("not").onclick = function(){
      st.miss++; markWeak(it.error_id, false); advance();
    };
    if ($("skip")) $("skip").onclick = advance;
    if ($("play07")) $("play07").onclick = function(){
      var keep = S.rate; S.rate = 0.7;
      SAY.speak(it.ja, null, function(){ S.rate = keep; });
    };
    if ($("play10")) $("play10").onclick = function(){
      var keep = S.rate; S.rate = 1;
      SAY.speak(it.ja, null, function(){ S.rate = keep; });
    };
    wireRecorder(m);

    function advance(){
      st.at++; st.open = d.type === "shadow";
      if (st.at >= items.length){
        st.at = 0;
        setHead([{ ja:"ドリル", r:"drill" }, { ja:d.title, r:"drill" }], d.title);
        $("main").innerHTML = '<h2>ひとまわり おわり<span class="en">Round '
          + 'finished</span></h2><p>' + st.hit + ' right, ' + st.miss
          + ' to come back to. The ones you flagged are waiting in Weak-spot '
          + 'review.</p><div class="row">'
          + '<button class="btn" id="again2">Go round again</button>'
          + '<button class="btn ghost" data-r="drill">Other drills</button></div>'
          + foot();
        st.hit = 0; st.miss = 0;
        $("again2").onclick = function(){ drawDrill(id, only); };
        each($("main"), "[data-r]", function(b){
          b.onclick = function(){ go(b.dataset.r); };
        });
        return;
      }
      drawDrill(id, only);
    }
  }

  function drawWeak(){
    var weak = weakList();
    setHead([{ ja:"ドリル", r:"drill" }, { ja:"よわい ところ", r:"drill:weak" }],
            "Weak-spot review");
    if (!weak.length){
      $("main").innerHTML = '<h2>よわい ところ<span class="en">Weak-spot '
        + 'review</span></h2><p>Nothing here yet. Work through a drill and tap '
        + '<b>Come back to this</b> on anything you did not have, and it will '
        + 'collect here.</p><div class="row">'
        + '<button class="btn" data-r="drill">Pick a drill</button></div>' + foot();
      each($("main"), "[data-r]", function(b){
        b.onclick = function(){ go(b.dataset.r); };
      });
      return;
    }
    var h = '<h2>よわい ところ<span class="en">The faults you flagged, with the '
          + 'items that test them</span></h2>'
          + '<p class="lede">These are the ones you asked to come back to. Clearing '
          + 'one takes two right answers in a row.</p>';
    weak.forEach(function(eid){
      var e = ERBYID[eid], w = S.weak[eid];
      if (!e) return;
      var found = [];
      ER.drills.forEach(function(d){
        if (d.error_ids.indexOf(eid) >= 0) found.push(d);
      });
      h += '<div class="card"><b>' + esc(e.name) + '</b> <span class="score">'
         + (w.hit || 0) + ' right, ' + (w.miss || 0) + ' missed</span>'
         + '<div class="en" style="margin:5px 0 7px">' + esc(e.why) + '</div>'
         + '<div class="side yes" style="margin:6px 0"><b>\u2714 this</b>'
         + jaLine(e.right) + '</div>'
         + '<div class="row">'
         + found.map(function(d){
             return '<button class="btn ghost" data-go="' + esc(d.id)
                  + '" data-only="' + esc(eid) + '">' + esc(d.title) + '</button>';
           }).join("")
         + '<button class="btn ghost" data-clear="' + esc(eid)
         + '">Clear it</button></div></div>';
    });
    $("main").innerHTML = h + foot();
    each($("main"), "[data-go]", function(b){
      b.onclick = function(){ drawDrill(b.dataset.go, [b.dataset.only]); };
    });
    each($("main"), "[data-clear]", function(b){
      b.onclick = function(){ delete S.weak[b.dataset.clear]; save(); drawWeak(); };
    });
  }

  /* ================= 4. the discussion builder =================
     The subtopic and the one image are the student's own. The image is held in
     this browser as a shrunken copy and goes nowhere else. */
  RENDER.disc = function(args){
    if (args[0] === "practice") return drawPractice();
    setHead([{ ja:"ディスカッション", r:"disc" }],
            "Discussion builder · your subtopic, your image");
    var D = S.disc;
    var m = $("main");
    var h = '<h2>ディスカッション<span class="en">Eight minutes on one subtopic and '
          + 'one image you bring in yourself</span></h2>'
          + '<div class="tip"><b>The rules about the image</b><ul '
          + 'style="margin:6px 0 0 18px">'
          + CRIT.visual_material.rules.map(function(r){
              return '<li>' + esc(r) + '</li>';
            }).join("") + '</ul></div>'
          + '<p class="note">Your image is stored in this browser only, on this '
          + 'phone. It is never uploaded anywhere.</p>'
          + '<label for="topja">Your subtopic, in Japanese</label>'
          + '<input type="text" id="topja" placeholder="おまつり" value="'
          + esc(D.topja || "") + '">'
          + '<label for="topen">And in English, for your own notes</label>'
          + '<input type="text" id="topen" placeholder="Japanese festivals" value="'
          + esc(D.topen || "") + '">'
          + '<h3>Your image</h3>';

    if (D.img){
      h += '<div class="shotwrap"><img class="shot" id="shot" src="' + D.img
         + '" alt="Your chosen image for the discussion"></div>'
         + '<div class="row"><button class="btn ghost" id="bigger">Full screen'
         + '</button><button class="btn ghost" id="drop">Remove it</button></div>';
    } else {
      h += '<div class="card flat" style="text-align:center;color:var(--muted)">'
         + 'No image yet.</div>';
    }
    h += '<div class="row"><label class="btn ghost" for="pick" '
       + 'style="margin:0">' + (D.img ? "Choose a different one" : "Choose or take a photo")
       + '<input type="file" id="pick" accept="image/*" hidden></label></div>';

    h += '<h3>Nine stages, and what to say at each</h3>'
       + '<p class="lede">Write a couple of lines for each. Three of the six '
       + 'VCAA oral exam reports say the thing that fails is not the Japanese but running out of '
       + 'things to say, so fill all nine before you polish any.</p>';

    QD.discussion_stages.forEach(function(st){
      var here = DISC.filter(function(q){ return q.topic === st.id; });
      var txt = (D.stage || {})[st.id] || "";
      h += '<details' + (txt ? "" : "") + '><summary>' + ruby(st.ja)
         + ' <span class="tier">' + esc(st.en) + (txt ? " · written" : "")
         + '</span></summary><div class="dbody">'
         + '<p class="en">' + esc(st.advice) + '</p>'
         + here.map(function(q){
             return '<div class="card flat" style="margin-top:8px">'
                  + jaLine(q.question_ja) + enLine(q.question_en) + '</div>';
           }).join("")
         + '<label for="st-' + esc(st.id) + '">What you will say</label>'
         + '<textarea id="st-' + esc(st.id) + '" data-stage="' + esc(st.id)
         + '" placeholder="…">' + esc(txt) + '</textarea>'
         + '<p class="note">Sentence frames for this are in the Phrases tab.</p>'
         + '</div></details>';
    });

    h += '<div class="row"><button class="btn wide" id="practise">'
       + 'Practise it on the clock</button></div>' + foot();
    m.innerHTML = h;

    $("topja").oninput = function(){ S.disc.topja = this.value; save(); };
    $("topen").oninput = function(){ S.disc.topen = this.value; save(); };
    each(m, "[data-stage]", function(t){
      t.oninput = function(){
        S.disc.stage = S.disc.stage || {};
        S.disc.stage[t.dataset.stage] = t.value;
        save();
      };
    });
    $("pick").onchange = function(){ takeImage(this.files && this.files[0]); };
    if ($("bigger")) $("bigger").onclick = function(){ showFull(D.img); };
    if ($("shot")) $("shot").onclick = function(){ showFull(D.img); };
    if ($("drop")) $("drop").onclick = function(){
      if (!confirm("Remove your image from this phone?")) return;
      delete S.disc.img; save(); RENDER.disc([]);
    };
    $("practise").onclick = function(){ go("disc:practice"); };
  };

  /* Shrunk before it is stored. A phone camera file is several megabytes and
     localStorage will not hold one; 1200px on the long edge is more than the
     screen can show anyway, and keeps a typical photo well inside the quota. */
  function takeImage(file){
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var max = 1200, w = im.width, h = im.height;
        if (Math.max(w, h) > max){
          var k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k);
        }
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(im, 0, 0, w, h);
        try {
          S.disc.img = cv.toDataURL("image/jpeg", 0.75);
          localStorage.setItem(KEY, JSON.stringify(S));
          RENDER.disc([]);
        } catch (e){
          flash("This phone would not store that image. Try a smaller one.");
        }
      };
      im.onerror = function(){ flash("That file did not open as an image."); };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  function showFull(src){
    if (!src) return;
    $("fullimg").src = src;
    $("full").classList.add("on");
  }
  $("fullx").onclick = function(){ $("full").classList.remove("on"); };

  var PR = null;
  function drawPractice(){
    var D = S.disc;
    if (!PR){
      var qs = [];
      QD.discussion_stages.forEach(function(st){
        var here = DISC.filter(function(q){ return q.topic === st.id; });
        if (here.length) qs.push(here[Math.floor(Math.random() * here.length)]);
      });
      PR = { qs:qs, at:0, left:CRIT.sections[1].minutes * 60, shown:false };
    }
    var q = PR.qs[PR.at];
    setHead([{ ja:"ディスカッション", r:"disc" }, { ja:"れんしゅう", r:"disc:practice" }],
            "Eight minutes, your own image");
    var m = $("main");
    var st = STAGENAME[q.topic] || { ja:q.topic, en:q.topic };
    var h = '<div class="clock" id="clock"><b id="cnum">--:--</b>'
          + '<span>left in the Discussion</span></div>';
    if (D.img){
      h += '<div class="shotwrap"><img class="shot" id="shot" src="' + D.img
         + '" alt="Your chosen image"></div>'
         + '<p class="note">Tap the image for full screen, the way the assessors '
         + 'will be looking at it.</p>';
    } else {
      h += '<div class="card flat" style="text-align:center;color:var(--muted)">'
         + 'No image yet. Add one in the builder and practise with it in front of '
         + 'you.</div>';
    }
    h += '<div class="step">' + ruby(st.ja) + ' · ' + esc(st.en) + '</div>';
    if (!PR.shown){
      h += '<div class="hidden-q">The assessor has asked you something.'
         + '<div class="row" style="justify-content:center">'
         + '<button class="btn" id="again">Hear it again</button>'
         + '<button class="btn ghost" id="show">Show it</button></div></div>';
    } else {
      h += '<div class="card">' + jaLine(q.question_ja) + enLine(q.question_en)
         + '</div>';
      var mine = (D.stage || {})[q.topic];
      if (mine)
        h += '<details><summary>What you wrote for this stage</summary>'
           + '<div class="dbody"><p style="white-space:pre-wrap">' + esc(mine)
           + '</p></div></details>';
    }
    h += recordBlock("disc");
    h += '<div class="row">'
       + '<button class="btn ghost" id="nextq">'
       + (PR.at < PR.qs.length - 1 ? "Next question" : "Finish") + '</button>'
       + '<button class="btn ghost" id="quit">Stop</button></div>' + foot();
    m.innerHTML = h;

    paintPr();
    stopClock();
    clockTimer = setInterval(function(){
      PR.left--; paintPr();
      if (PR.left <= 0){ stopClock(); }
    }, 1000);

    if (!PR.shown) SAY.speak(q.question_ja);
    if ($("again")) $("again").onclick = function(){ SAY.speak(q.question_ja); };
    if ($("show")) $("show").onclick = function(){ PR.shown = true; drawPractice(); };
    if ($("shot")) $("shot").onclick = function(){ showFull(D.img); };
    $("nextq").onclick = function(){
      if (PR.at < PR.qs.length - 1){ PR.at++; PR.shown = false; drawPractice(); }
      else { stopClock(); PR = null; go("me"); }
    };
    $("quit").onclick = function(){ stopClock(); PR = null; go("disc"); };
    wireRecorder(m);

    function paintPr(){
      var el = $("cnum"); if (!el) return;
      var s = Math.max(0, PR.left);
      el.textContent = Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
      $("clock").classList.toggle("low", s <= 60);
    }
  }

  /* ================= 5. the phrase bank ================= */
  RENDER.phrase = function(args){
    if (args[0]) return drawGroup(args[0]);
    setHead([{ ja:"フレーズ", r:"phrase" }], "Phrases · six groups");
    /* The front page used to describe the groups in one sentence about the
       image, which only fitted two of the six and left a student guessing
       which tile held what. Each tile now says what is inside it instead. */
    var h = '<h2>フレーズ<span class="en">Lines worth knowing by heart, in six '
          + 'groups</span></h2>'
          + '<div class="tiles">'
          + PH.groups.map(function(g){
              return '<button class="tile" data-g="' + esc(g.id) + '">'
                   + '<b>' + ruby(g.name_ja) + '</b>'
                   + '<i>' + esc(g.name_en) + ' · ' + g.phrases.length
                   + ' lines</i>'
                   + '<i class="what">' + esc(g.tile_en) + '</i></button>';
            }).join("") + '</div>' + foot();
    $("main").innerHTML = h;
    each($("main"), "[data-g]", function(b){
      b.onclick = function(){ go("phrase:" + b.dataset.g); };
    });
  };
  function drawGroup(id){
    var g = null;
    PH.groups.forEach(function(x){ if (x.id === id) g = x; });
    if (!g) return go("phrase", true);
    setHead([{ ja:"フレーズ", r:"phrase" }, { ja:g.name_ja, r:"phrase" }], g.name_en);
    var h = '<h2>' + ruby(g.name_ja) + '<span class="en">' + esc(g.name_en)
          + '</span></h2><p class="lede">' + esc(g.about) + '</p>'
          + g.phrases.map(function(p){
              return '<div class="card">'
                   + jaLine(p.ja, p.say || p.ja) + enLine(p.en)
                   + (p.say ? '<div class="tier" style="margin-top:7px">'
                       + 'With the blank filled</div>' + jaLine(p.say)
                       + (p.say_en ? enLine(p.say_en) : "") : "")
                   + '</div>';
            }).join("")
          + g.report_refs.map(function(r){
              return '<div class="tip"><q>' + esc(r) + '</q></div>';
            }).join("") + foot();
    $("main").innerHTML = h;
  }

  /* ================= 6. my record ================= */
  RENDER.me = function(args){
    if (args[0] === "crit") return drawCriterion(args[1]);
    setHead([{ ja:"じぶんで さいてん", r:"me" }], "Self-grade · stays on this phone");
    var notes = Object.keys(S.notes).filter(function(k){ return S.notes[k]; });
    var h = '<h2>じぶんで さいてん<span class="en">What you have written, how you '
          + 'marked yourself, and a copy you can keep</span></h2>'
          + '<h3>Mark yourself against the four criteria</h3>'
          + '<p class="lede">The band descriptions are the official ones, word for '
          + 'word, from the assessment criteria and descriptors document '
          + '(' + esc(CRIT.sources[0].version) + '). Be honest; the point is to find '
          + 'the band you are actually in.</p>';
    CRIT.sections.forEach(function(s){
      h += '<div class="step">Section ' + s.number + ' · ' + esc(s.name_en)
         + ' · ' + s.marks + ' marks</div>';
      s.criteria.forEach(function(c){
        var got = S.assess[c.id];
        h += '<button class="card" data-crit="' + esc(c.id) + '">'
           + '<b>' + esc(c.name) + '</b>'
           + '<div class="en" style="margin-top:4px">' + esc(c.scope) + '</div>'
           + '<div style="margin-top:7px">'
           + (got ? '<span class="mark">' + esc(got) + '</span>'
                    + ' <span class="score">out of ' + c.max + '</span>'
                  : '<span class="score">not marked yet</span>')
           + '</div></button>';
      });
    });
    var total = 0, any = false;
    Object.keys(S.assess).forEach(function(k){
      var v = String(S.assess[k]).split("–")[0];
      if (v){ total += parseInt(v, 10) || 0; any = true; }
    });
    if (any)
      h += '<div class="card"><b>Rough total</b> <span class="mark">'
         + total + '</span> <span class="score">out of ' + CRIT.examination.total_marks
         + ', using the bottom of each band you picked</span></div>';

    h += '<h3>What you have written</h3>';
    if (!notes.length){
      h += '<p class="lede">Nothing yet. Your answers appear here as you type them '
         + 'under a question.</p>';
    } else {
      h += notes.map(function(k){
        var q = QBYID[k.replace(/^/, "")];
        return '<button class="card" data-r="browse:q:' + esc(k) + '">'
             + (q ? '<span class="jatext">' + ruby(q.question_ja) + '</span>'
                  : '<b>' + esc(k) + '</b>')
             + '<p style="white-space:pre-wrap;margin-top:6px">'
             + esc(S.notes[k]) + '</p></button>';
      }).join("");
    }

    h += '<h3>Keep a copy</h3>'
       + '<p class="lede">Everything above lives in this browser only. Clearing your '
       + 'browsing data would take it with it, so save a copy before an examination '
       + 'or when you change phones. The file is plain text you can read.</p>'
       + '<div class="row">'
       + '<button class="btn" id="exp">Save a copy</button>'
       + '<label class="btn ghost" for="imp" style="margin:0">Load a copy'
       + '<input type="file" id="imp" accept=".json,application/json" hidden></label>'
       + '<button class="btn warn" id="wipe">Clear everything</button></div>'
       + '<p class="note">A saved copy does not include your image, which can be '
       + 'large. Keep the photo itself in your own photo library.</p>'
       + foot();
    $("main").innerHTML = h;
    each($("main"), "[data-crit]", function(b){
      b.onclick = function(){ go("me:crit:" + b.dataset.crit); };
    });
    each($("main"), "[data-r]", function(b){
      b.onclick = function(){ go(b.dataset.r); };
    });
    $("exp").onclick = exportCopy;
    $("imp").onchange = function(){ importCopy(this.files && this.files[0]); };
    $("wipe").onclick = function(){
      if (!confirm("Clear everything this app has saved on this phone, including "
                 + "your image and your notes?")) return;
      try { localStorage.removeItem(KEY); } catch (e){}
      S = { furi:true, rate:1, voice:"clips", notes:{}, assess:{}, disc:{},
            weak:{}, seen:{} };
      paintFuri(); paintRate(); RENDER.me([]);
    };
  };

  function drawCriterion(cid){
    var got = CRITBYID[cid];
    if (!got) return go("me", true);
    var c = got.c, s = got.section;
    setHead([{ ja:"じぶんで さいてん", r:"me" }, { ja:c.name, r:"me" }],
            "Section " + s.number + " · " + c.name + " · " + c.max + " marks");
    var h = '<h2>' + esc(c.name) + '<span class="en">' + esc(c.scope)
          + '</span></h2>'
          + '<div class="card"><b>What is being judged</b><ul '
          + 'style="margin:6px 0 0 18px;font-size:15.5px">'
          + c.qualities.map(function(q){ return '<li>' + esc(q) + '</li>'; }).join("")
          + '</ul></div>'
          + (c.source_wording ? '<p class="note">The published criteria are written '
              + 'for every language at once. The original reads: <q>'
              + esc(c.source_wording) + '</q></p>' : "")
          + '<h3>Which band were you in?</h3><div class="bands">'
          + c.descriptors.map(function(d){
              return '<button class="band' + (S.assess[cid] === d.band ? " on" : "")
                   + '" data-band="' + esc(d.band) + '"><b>' + esc(d.band) + '</b>'
                   + '<span>' + d.text.map(esc).join("<br>") + '</span></button>';
            }).join("")
          + '</div>'
          + '<div class="row"><button class="btn ghost" data-r="me">Done</button>'
          + '</div>' + foot();
    $("main").innerHTML = h;
    each($("main"), "[data-band]", function(b){
      b.onclick = function(){
        S.assess[cid] = (S.assess[cid] === b.dataset.band) ? "" : b.dataset.band;
        if (!S.assess[cid]) delete S.assess[cid];
        save(); drawCriterion(cid);
      };
    });
    each($("main"), "[data-r]", function(b){
      b.onclick = function(){ go(b.dataset.r); };
    });
  }

  function exportCopy(){
    var out = { app:"oral-exam", build:BUILD, saved:new Date().toISOString(),
                notes:S.notes, assess:S.assess, weak:S.weak,
                disc:{ topja:S.disc.topja || "", topen:S.disc.topen || "",
                       stage:S.disc.stage || {} } };
    var blob = new Blob([JSON.stringify(out, null, 2)], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "oral-exam-notes.json";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }
  function importCopy(file){
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function(){
      var got;
      try { got = JSON.parse(fr.result); }
      catch (e){ return flash("That file is not one of these saved copies."); }
      if (!got || got.app !== "oral-exam")
        return flash("That file is not one of these saved copies.");
      if (!confirm("Replace what is on this phone with the saved copy?")) return;
      S.notes = got.notes || {};
      S.assess = got.assess || {};
      S.weak = got.weak || {};
      var img = S.disc.img;
      S.disc = got.disc || {};
      if (img) S.disc.img = img;      /* the image is not in the file; keep it */
      save(); RENDER.me([]);
    };
    fr.readAsText(file);
  }

  /* ================= recording =================
     MediaRecorder, held in this page's memory and nowhere else. It is not
     written to storage, because an audio file is far larger than a browser
     will keep and this app has no server to send one to. Save it keeps it in
     the phone's own files; otherwise it goes when the tab closes, and the UI
     says so rather than pretending otherwise. */
  var REC = { on:false, mr:null, chunks:[], url:null, slot:null, stream:null };

  function recordBlock(slot){
    var mine = REC.url && REC.slot === slot;
    return '<div class="card" data-rec="' + esc(slot) + '">'
         + '<div class="rec">'
         + '<button class="btn' + (REC.on && REC.slot === slot ? " warn" : " ghost")
         + '" data-recbtn="1">'
         + (REC.on && REC.slot === slot ? '<span class="dot"></span>Stop'
                                       : 'Record yourself') + '</button>'
         + (mine ? '<button class="btn ghost" data-recsave="1">Save it</button>'
                 : "")
         + '</div>'
         + (mine ? '<audio controls src="' + REC.url + '"></audio>' : "")
         + '<div class="note">Recordings stay in this phone and are never '
         + 'uploaded. They last until you close the app, so use Save to keep '
         + 'one.</div></div>';
  }
  function wireRecorder(scope){
    each(scope, "[data-recbtn]", function(b){
      var slot = b.closest("[data-rec]").dataset.rec;
      b.onclick = function(){
        if (REC.on) return stopRec();
        startRec(slot);
      };
    });
    each(scope, "[data-recsave]", function(b){
      b.onclick = function(){
        if (!REC.url) return;
        var a = document.createElement("a");
        a.href = REC.url;
        a.download = "oral-practice-" + new Date().toISOString().slice(0, 16)
                   .replace(/[:T]/g, "-") + ".webm";
        a.click();
      };
    });
  }
  function startRec(slot){
    if (!navigator.mediaDevices || !window.MediaRecorder)
      return flash("This browser cannot record. Everything else still works.");
    SAY.stop();
    navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
      REC.stream = stream;
      REC.chunks = [];
      try { REC.mr = new MediaRecorder(stream); }
      catch (e){ return flash("This browser cannot record."); }
      REC.mr.ondataavailable = function(ev){
        if (ev.data && ev.data.size) REC.chunks.push(ev.data);
      };
      REC.mr.onstop = function(){
        if (REC.url) URL.revokeObjectURL(REC.url);
        REC.url = URL.createObjectURL(new Blob(REC.chunks, { type:"audio/webm" }));
        REC.on = false;
        stream.getTracks().forEach(function(t){ t.stop(); });
        draw();
      };
      REC.on = true; REC.slot = slot;
      REC.mr.start();
      draw();
    }, function(){
      flash("Microphone permission was refused, so recording is off.");
    });
  }
  function stopRec(){
    try { REC.mr.stop(); } catch (e){ REC.on = false; draw(); }
  }

  function foot(){
    return '<p class="foot">VCE Japanese Second Language oral examination practice. '
         + 'Criteria and descriptors from the VCAA assessment criteria document '
         + esc(CRIT.sources[0].version) + '; examiner tips quoted from the '
         + 'VCAA oral exam reports 2020 to 2025. Rough draft, for Andrew to react to. '
         + esc(BUILD) + '</p>';
  }

  /* ================= service worker ================= */
  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        function offer(w){
          if (!w) return;
          var bar = $("upbar");
          bar.classList.add("on");
          $("upnow").onclick = function(){
            w.postMessage({ type:"SKIP_WAITING" });
            setTimeout(function(){ location.reload(); }, 150);
          };
          $("uplater").onclick = function(){ bar.classList.remove("on"); };
          if (w.postMessage){
            var ch = new MessageChannel();
            ch.port1.onmessage = function(ev){
              if (ev.data && ev.data.version)
                $("upmsg").textContent = ev.data.version + " is ready.";
            };
            try { w.postMessage({ type:"VERSION" }, [ch.port2]); } catch (e){}
          }
        }
        if (reg.waiting) offer(reg.waiting);
        reg.addEventListener("updatefound", function(){
          var w = reg.installing;
          if (!w) return;
          w.addEventListener("statechange", function(){
            if (w.state === "installed" && navigator.serviceWorker.controller) offer(w);
          });
        });
      }).catch(function(){});
    });
  }
  $("uplater").onclick = function(){ $("upbar").classList.remove("on"); };

  /* ================= start ================= */
  paintFuri(); paintRate();
  $("homeBtn").onclick = function(){ SAY.stop(); go("home"); };
  route = (location.hash || "#home").slice(1) || "home";
  go(route, true);
})();
</script>
</body>
